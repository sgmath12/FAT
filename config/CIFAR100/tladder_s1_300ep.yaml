# Student for the seed-1 teacher ladder at 300 epochs (2026-09-20).  Identical to the seed-0 ladder
# cells: 50 epochs, anchor only, no stack, student seed 0; only the teacher checkpoint changes.
method : feat_direction
featdir_freeze_head : True
featdir_span : random
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 16
kappa : 0.999
eta : 512
aug : none
eps : 8/255
steps : 10
step_size : 2/255/1
epochs : 50
batch_size : 128
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : False   # dead flag: only a fallback when student_norm is absent (utils.py:459); student_norm is explicit below
student_norm : False
teacher_norm : False
teacher_cos_head : False
featdir_normfeat_target : False
featdir_rawteacher : True
featdir_rawstudent : True
featdir_head_ce : False
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean_s1_300ep_seed1/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_s1_300ep_seed1/clean_last.pkl
data_root : ./data
