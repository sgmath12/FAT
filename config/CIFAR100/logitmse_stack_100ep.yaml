# FROZEN-HEAD LOGIT MSE AT THE FULL STACK (2026-09-08).
#
# The base regime has the logit MSE at 62.59 / 25.69 against the anchor's 62.72 / 25.88, i.e. a tie
# inside the seed spread.  The question that decides how the paper frames this is whether the tie
# survives the stack, since the shipped row is 62.17 / 28.86 with weight averaging, the AWP proxy
# and the sensitivity-matched radius.  This cell is the logit half of that comparison at the shipped
# recipe minus the radius rule: 100 epochs, WA, AWP, train_eps 8.8/255.
#
# Its pair is kdsym_stack_t16, and the anchor's counterpart at the same setting is
# ladder_p0_wa_awp_fh_100ep (60.42 / 28.42).
#

method : logit_mse
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 1
kappa : 0.999
eta : 512
aug : none
eps : 8/255
steps : 10
step_size : 2/255/1
train_eps : 0.03450980392156863
epochs : 100
batch_size : 128
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : False
student_norm : False
teacher_norm : False
teacher_cos_head : False
cyclic : True
weight_avg : True
wa_start : 0.2
awp_gamma : 0.005
awp_warmup : 10
checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
