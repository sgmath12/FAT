# Same as the champion (featdir_span_random_10step_wa.yaml) but the natural teacher/finetune-init
# checkpoint is swapped from the 50ep clean model to the 300ep clean model (clean acc 75.81 -> 78.32,
# see 2026-07-21 clean-epoch sweep) to test whether a better-converged teacher improves the student.
method : feat_direction
featdir_span : random
gain_head : False
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 16
kappa : 0.999
aug : none
eps : 8/255
steps : 10
step_size : 2/255/1
epochs : 50
batch_size : 128
interval : 5
aa : False
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : True
checkpoint : CIFAR100/checkpoint/clean_300ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_300ep/clean_last.pkl
data_root : ./data
