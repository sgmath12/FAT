# 1-epoch SMOKE TEST of temp_tauclass_bilevel.yaml (identical except epochs 1, evaluate False):
# exercises the meta phase (window 0-10 covers epoch 0) end-to-end -- proxy step, meta batch,
# 2nd-order grad into log_tau_c, own-SGD step, real AdamW step -- without committing to a full run.
# Delete-safe; results/CIFAR100/temp_tauclass_bilevel_smoke/ is throwaway.
method : temperature_tauclass_bilevel
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
tau : 16
kappa : 0.999
aug : none
eps : 8/255
steps : 3
step_size : 4/255/1
epochs : 1
batch_size : 128
interval : 5
log : True
load : True
finetune : True
evaluate : False
reformation : True
student_norm : True
teacher_norm : False
tau_classwise : True
val : True
bilevel_start : 0
bilevel_end : 10
tau_meta_lr : 100
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
aa : False
