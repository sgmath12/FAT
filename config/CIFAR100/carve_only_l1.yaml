# carve-only teacher target, L1 fragility (its own method train_carve_only_l1; NOT the transform dispatcher).
#   teacher: raw (teacher_norm=False). Fragile channels found by PGD-gamma (gamma=2 -> PGD-2, NOT FGSM),
#           per-channel fragility = |Phi_t(x) - Phi_t(x_adv)| (L1), down-weighted by w=exp(-tau*fragility),
#           pushed through teacher's own linear head. NO /13 rescale, NO teacher norm. tau = carve strength.
#   student: L2-norm features (student_norm=True -> ResNet18_z). Untouched by carve.
# 'l1' = fragility metric (L2/squared variant = carve_only_l2). Fast regime (steps=3, step_size 4/255);
#   steps=10 version is a SEPARATE config: carve_only_l1_10step.yaml.
# Results -> results/CIFAR100/carve_only_l1/output.log. Sweep tau with: --tau 0.1 (append per tau).
method : carve_only_l1
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
gamma : 2
lamda : 0.0
tau : 0.1
kappa : 0.999
aug : none
eps : 8/255
steps : 3
step_size : 4/255/1
epochs : 50
batch_size : 128
interval : 5
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
