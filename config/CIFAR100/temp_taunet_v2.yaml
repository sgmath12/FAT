# taunet with a BIGGER MLP (user's idea, 2026-07-04): same 3 interpretable stats (norm/margin/entropy),
#   no swap -- isolates whether more capacity alone helps beyond temp_taunet.yaml's 41.51 H.
#   tau_bn: BatchNorm1d(3, affine=False) on the raw stats before the MLP (they live on very different
#     scales: norm ~10-20, entropy 0-4.6 nats, margin variable) -- helps the MLP's random init see a
#     well-conditioned input instead of learning the rescaling itself.
#   tau_hidden/tau_depth: 32->64 width, 1->2 hidden layers.
method : temperature_taunet
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
tau : 16
kappa : 0.999
aug : none
eps : 8/255
steps : 3
step_size : 4/255/1
epochs : 50
batch_size : 128
interval : 5
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
tau_adapt : True
tau_hidden : 64
tau_depth : 2
tau_bn : True
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
