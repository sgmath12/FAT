# SUBSPACE cell (random span, 2026-07-13 evening): dir loss + attack projected onto the k=100
# orthonormalized RANDOM subspace. teacher-span recovers robust + random fails -> 'the class
# subspace is what must be defended, and the teacher's copy of it suffices' (exists-and-unique).
#   Attack        = maximize the direction loss (inner_featdir_only_return); teacher head w_t is
#   deleted from backbone path AND attack. This cell keeps the ordinary free linear head (gain_head
#   False) so the pipeline change is isolated before adding the gain-only head (featdir_gainhead).
#   3-step; bar = temp_studentNorm_teacherRaw tau16 H 41.77 (seed0). Sweep beta via --beta.
method : feat_direction
featdir_span : random
gain_head : False
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 16
kappa : 0.999
aug : none
eps : 8/255
steps : 3
step_size : 4/255/1
epochs : 50
batch_size : 128
interval : 5
aa : False
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
