# ARREST own recipe (SGD, 20 epochs, its lr schedule, 8/255) + WA only (kappa 0.999 from 20%), 2026-09-15.

method : arrest
arrest_lambda : 50.0
arrest_phi : 30.0
weight_decay : 0.0005
dataset : CIFAR100
arch : ResNet18
optim : SGD
lr : 0.025
lr_schedule : arrest
cyclic : False
epochs : 20
batch_size : 128
eps : 8/255
steps : 10
step_size : 2/255/1
weight_avg : True
wa_start : 0.2
kappa : 0.999
alpha : 1.0
beta : 6.0
lamda : 0.0
tau : 16
eta : 512
aug : none
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : False
student_norm : False
teacher_norm : False
checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
