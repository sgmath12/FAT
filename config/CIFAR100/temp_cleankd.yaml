# USER IDEA: also distill the student's CLEAN forward f(x) from the teacher f_t(x) (same fixed
#   target = teacher(x)/tau), not just the adversarial f(x_adv). Currently clean student_logits=model(x)
#   is only used for BN-stat update -- never supervised against the teacher at all.
#   loss += beta * KL(student(x) || target). beta=0 == train_temperature baseline exactly.
#   Base = tau=16, isolated (lamda=0, weight_avg=False). Sweep beta via --beta.
#   Results -> results/CIFAR100/temp_cleankd/output.log (parse by beta).
method : temperature_dualkd
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 0.0
tau : 16
kappa : 0.999
aug : none
eps : 8/255
steps : 3
step_size : 4/255/1
epochs : 50
batch_size : 128
interval : 5
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
