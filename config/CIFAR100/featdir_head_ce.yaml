# Hard-CE head cell (2026-07-17, user q): identical to champion but head trained with
# CE(head_logits, y) instead of KL to z_t/tau -- backbone already teacher-anchored via
# L_dir, does the head even need soft targets? Compare vs champion NRR 37.06.
method : feat_direction
featdir_head_ce : True
featdir_span : random
gain_head : False
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 16
kappa : 0.999
aug : none
eps : 8/255
steps : 10
step_size : 2/255/1
epochs : 50
batch_size : 128
interval : 5
aa : False
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : True
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
