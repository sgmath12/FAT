# Geometry-calibrated clean-feature anchor: gamma = -0.5.
# The teacher, inherited classifier, initialization and predictions are unchanged.  Only the
# diagonal metric applied to Phi_s(x_adv)-Phi_t(x) changes.  Negative gamma de-emphasizes teacher
# coordinates with high between/within-class scatter, providing the de-collapsed side of the
# causal sweep around the existing gamma=0 anchor.
method : feat_direction
featdir_freeze_head : True
featdir_span : geometry_diag
featdir_geom_gamma : -0.5
featdir_geom_lo : 0.5
featdir_geom_hi : 2.0
featdir_geom_ridge : 0.01
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 16
kappa : 0.999
eta : 512
aug : none
eps : 8/255
steps : 10
step_size : 2/255/1
epochs : 50
batch_size : 128
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : False
student_norm : False
teacher_norm : False
teacher_cos_head : False
featdir_normfeat_target : False
featdir_rawteacher : True
featdir_rawstudent : True
featdir_head_ce : False
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
