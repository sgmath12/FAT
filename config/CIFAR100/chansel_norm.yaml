# CIFAR100 #4 on NORM base: per-dim deviation selection ON TOP of L2-normalization.
# Tests paper §4 thesis: does non-robustness survive in DIRECTIONS after magnitude is
# removed by norm? beta=0 == iso3 norm-const (the +clean baseline); beta>0 must BEAT it.
method : DPFAT_chansel
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 0.7
beta : 1.0
lamda : 0.0
tau : 0.0
kappa : 0.999
aug : none
eps : 8/255
steps : 3
step_size : 4/255/1
epochs : 50
batch_size : 128
interval : 5
log : True
load : True
finetune : True
evaluate : True
reformation : True
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
