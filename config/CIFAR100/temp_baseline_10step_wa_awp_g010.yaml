# AWP gamma=0.01 isolation (2026-07-16): normalization-absorption hypothesis test --
# default gamma=5e-3 gave near-zero robust gain on baseline+WA; 2x gamma checks if the
# perturbation is simply too small (partially absorbed by the feature L2-normalize).
method : temperature
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
tau : 16
kappa : 0.999
aug : none
eps : 8/255
steps : 10
step_size : 2/255/1
epochs : 50
batch_size : 128
interval : 5
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : True
awp_gamma : 0.01
awp_warmup : 5
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
