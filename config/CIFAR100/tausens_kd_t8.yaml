# TEMPERATURE SWEEP, plain pure-KD, RAW design, base regime -- tau = 8 (2026-09-07).
#
# Fills the gap between the tau = 1 / 4 / 16 cells the analysis reports, so the sweep in
# \Cref{sec:fragile} is read on five points rather than three.  The peak sits at tau = 4 on the
# three-point grid, and tau = 2 and tau = 8 are what decide whether that is a peak or the flat top of
# a plateau.
#
# Identical to tausens_kd_t4 in every other field: 50 epochs, AdamW 0.021, OneCycle, warm start from
# the natural teacher, eps 8/255, no weight averaging, no AWP, no feat_scale.
#

method : temperature
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 8
kappa : 0.999
aug : none
eps : 8/255
steps : 10
step_size : 2/255/1
epochs : 50
batch_size : 128
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : False
student_norm : False
teacher_norm : False
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
