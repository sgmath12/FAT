# ARREST WITH EVERYTHING OUR ROW HAS (2026-09-12).
#
# Layer three of tab:main for ARREST: its objective, our optimizer (AdamW 0.021 under one cycle), our
# training radius 8.8/255, 100 epochs, and our stack (weight averaging kappa 0.999 from 20%, AWP proxy
# gamma 0.005 after epoch 10).  Noisy Replay still covers the first half, now 50 epochs.
#

method : arrest
arrest_lambda : 50.0
arrest_phi : 30.0
weight_decay : 0.0005
dataset : CIFAR100
arch : ResNet18
optim : AdamW
lr : 0.021
cyclic : True
train_eps : 0.03450980392156863
epochs : 100
batch_size : 128
eps : 8/255
steps : 10
step_size : 2/255/1
weight_avg : True
wa_start : 0.2
awp_gamma : 0.005
awp_warmup : 10
awp_style : proxy
kappa : 0.999
alpha : 1.0
beta : 6.0
lamda : 0.0
tau : 16
eta : 512
aug : none
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : False
student_norm : False
teacher_norm : False
checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
