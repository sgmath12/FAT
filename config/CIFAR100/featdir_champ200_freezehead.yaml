# CHAMPION STACK x FROZEN HEAD (2026-08-02). Theorem 2 test. Identical to featdir_champ200_100ep
# except the student head is never trained: it stays exactly as loaded from the teacher, and the
# head loss term is dropped entirely. Only the backbone learns.
#
# Pairs with featdir_champ200_tau1: that cell keeps the SAME target function (the teacher's raw
# logits) but lets the head adapt to the student's own -- and drifting -- feature distribution.
# frozen vs tau1 therefore isolates ADAPTATION alone, with the target held fixed. Theorem 2 says
# the student's features sit 38-46 degrees off the teacher's (cos_adv 0.79 at eps 8, 0.69 at 8.8)
# with a different mean and variance, so a head calibrated on phi_t must be miscalibrated here.
#   large loss  -> Theorem 2 confirmed; re-solving the head is the necessary part of the method
#   tie         -> Theorem 2 dead; the teacher head transfers as-is and the method gets simpler
#
# feat_scale 11.23 = measured mean ||phi_t|| on clean_200ep. The frozen head expects inputs at the
# teacher's scale and its bias is NOT rescaled, so feeding a unit vector would let the bias dominate
# and confound "the head is miscalibrated" with "the input scale is wrong".
# Bar: 60.74 clean / 34.94 PGD-20 / 30.53 CW / 28.69 AA.
method : feat_direction
featdir_freeze_head : True
feat_scale : 11.23
featdir_span : random
gain_head : False
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 16
kappa : 0.999
eta : 512
aug : none
eps : 8/255
train_eps : 0.03450980392156863
steps : 10
step_size : 2/255/1
epochs : 100
freeze_lr_epoch : 0.65
wa_start : 0.2
batch_size : 128
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : True
awp_style : proxy
awp_gamma : 0.005
awp_warmup : 10
checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
