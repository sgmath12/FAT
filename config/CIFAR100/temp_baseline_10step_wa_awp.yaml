# AWP isolation cell (2026-07-15): baseline+WA + AWP (Wu et al. NeurIPS'20), lamda0 to
# isolate AWP's own effect before stacking with the lamda dose. gamma=5e-3 standard,
# warmup=5 (model starts from a fine-tuned-not-random init, short warmup is enough).
# Bar: baseline+WA lamda0 = 61.77/33.43/cw28.18 (s0).
method : temperature
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
tau : 16
kappa : 0.999
aug : none
eps : 8/255
steps : 10
step_size : 2/255/1
epochs : 50
batch_size : 128
interval : 5
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : True
awp_gamma : 0.005
awp_warmup : 5
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
