# Ladder student for the clean_wd5e3_200ep teacher (2026-09-19): identical to the other ladder cells,
# 50 epochs with no stack, so the teacher checkpoint is the only thing that changes.
method : feat_direction
featdir_freeze_head : True
featdir_span : random
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 16
kappa : 0.999
eta : 512
aug : none
eps : 8/255
steps : 10
step_size : 2/255/1
epochs : 50
batch_size : 128
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : False   # dead flag: only a fallback when student_norm is absent (utils.py:459); student_norm is explicit below
student_norm : False
teacher_norm : False
teacher_cos_head : False
featdir_normfeat_target : False
featdir_rawteacher : True
featdir_rawstudent : True
featdir_head_ce : False
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean_wd5e3_200ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_wd5e3_200ep/clean_last.pkl
data_root : ./data
