# AWP WITHOUT WEIGHT AVERAGING (2026-09-24).  tab:ladder adds the stack in one order, WA then AWP, so
# it never measures AWP on its own and cannot separate the two from their interaction.  This is the
# missing cell of the 2x2 {WA off, on} x {AWP off, on} at p = 1; everything else matches champ_eps8.

method : feat_direction
featdir_freeze_head : True
featdir_angeps_p : 1.0
featdir_rawteacher : True
featdir_rawstudent : True
featdir_span : random
gain_head : False
dataset : CIFAR100
arch : ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 16
kappa : 0.999
eta : 512
aug : none
eps : 8/255
steps : 10
step_size : 2/255/1
train_eps : 0.031372549019607843
epochs : 100
wa_start : 0.2
batch_size : 128
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : False
teacher_norm : False
cyclic : True
weight_avg : False
awp_style : proxy
awp_gamma : 0.005
awp_warmup : 10
checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
