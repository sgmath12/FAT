# COSINE teacher, 200 epochs, no mixup -- 2026-08-01. Same schedule as clean_200ep but trained
# end-to-end with a cosine classifier (ResNet18_zcos: feature AND weight rows L2-normalized,
# logits = s*cos, s learnable). Pair for the guidance grid: does a teacher whose TRAINING
# objective was angular donate a better direction than one that never cared about angles?
# Record its clean acc -- if it lands far below clean_200ep (77.59) the comparison is confounded.
# The other server's champion recipe was distilled from a 200ep clean teacher; this reproduces
# that teacher here so the freeze_lr_epoch / train_eps / lamda comparison isn't confounded by a
# different teacher. Same SGD/OneCycle recipe as clean_100ep / clean_150ep / clean_300ep.
# Checkpoint lands in CIFAR100/checkpoint/clean_200ep/clean_last.pkl.
method : clean
dataset : CIFAR100
arch: ResNet18
optim : SGD

lr : 0.1
alpha : 0.0
beta : 0.0
gamma : 0.0
eta : 0.0
# attack Setting
eps : 8/255
steps : 10
step_size : 2/255/1
epochs : 200


batch_size : 128
interval : 5
neptune : True
load : False
finetune : False
evaluate : False
reformation : True
student_norm : True
teacher_norm : False
cos_head : True
save : False
exp_name: KD
val : False
aug : none
log : True
cyclic : True
data_root : ./data
