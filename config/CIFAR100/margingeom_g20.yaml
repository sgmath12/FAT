# Strong dose of the teacher-epoch-aligned margin/rotation metric.
# Relative coordinate weights are squared (gamma=2); RMS normalization and [0.5, 2.0] clipping
# keep the comparison from becoming a global loss-scale change.
method : feat_direction
featdir_freeze_head : True
featdir_span : robust_geometry_diag
featdir_robgeom_signal : separation
featdir_robgeom_gamma : 2.0
featdir_robgeom_lo : 0.5
featdir_robgeom_hi : 2.0
featdir_robgeom_ridge : 0.05
featdir_robgeom_steps : 5
featdir_robgeom_batches : 0
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 16
kappa : 0.999
eta : 512
aug : none
eps : 8/255
steps : 10
step_size : 2/255/1
epochs : 50
batch_size : 128
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : False
student_norm : False
teacher_norm : False
teacher_cos_head : False
featdir_normfeat_target : False
featdir_rawteacher : True
featdir_rawstudent : True
featdir_head_ce : False
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
