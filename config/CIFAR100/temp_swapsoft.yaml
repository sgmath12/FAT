# Global temperature + SOFT swap-rectification. method train_temperature_swapsoft.
#   target = rectify_soft(teacher_logits, y, margin=beta) / tau.  Float true class to (max+beta) ONLY where
#   teacher is wrong; keep every other logit -> confusion structure (dark knowledge) preserved (vs hard swap
#   which demotes the wrong-top class). student L2-norm, teacher raw, NO /13. steps=3.
#   knobs: tau = global temperature, beta = margin (logit space). Sweep via --tau / --beta.
# Results -> results/CIFAR100/temp_swapsoft/output.log (cells distinguished by tau + beta, both logged).
# Compare vs hard swap-baseline 42.17 (tau16).
method : temperature_swapsoft
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
tau : 16
beta : 1.0
kappa : 0.999
aug : none
eps : 8/255
steps : 3
step_size : 4/255/1
epochs : 50
batch_size : 128
interval : 5
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
