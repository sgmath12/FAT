# temp_studentNorm_teacherRaw ABLATION: student NOT initialized from the clean (teacher) checkpoint.
# Identical to temp_studentNorm_teacherRaw.yaml except finetune: False -> student starts from random init
# (load: True still loads the TEACHER from the clean checkpoint; see utils.py get_model).
# tau swept via --tau INSIDE this one folder:
#   results/CIFAR100/temp_studentNorm_teacherRaw_no_init/output.log  (append; parse by tau).
method : temperature
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
tau : 1
kappa : 0.999
aug : none
eps : 8/255
steps : 3
step_size : 4/255/1
epochs : 50
batch_size : 128
interval : 5
log : True
load : True
finetune : False
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
aa : False
