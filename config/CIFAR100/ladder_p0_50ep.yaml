# ANGEPS LADDER, bottom rung (2026-08-30): the anchor alone, with train_eps held at 8.8/255 like the
# rest of the ladder, so that sensitivity-matched eps is the ladder's FIRST step rather than an
# assumption baked into its baseline.
#
# Nothing at train_eps 8.8/255 currently occupies this cell.  The existing p=0 cells are either at
# eps 8/255 (`wadec_raw_nowa` 62.40 / AA 24.34 at 100ep; `tausens_fd_nohd` 62.72 / 25.88 at 50ep) or
# already carry WA (`wadec_raw_wa_eps88` 60.09 / 27.00) -- so neither is the partner of
# `ladder_angeps_*ep`, which differs from this cell in one line.
#
# Ladder, all raw-L2 anchor, train_eps 8.8/255, no freeze_lr, at 50 and 100 epochs:
#   this cell          anchor
#   ladder_angeps      + sensitivity-matched eps
#   ladder_angeps_wa   + weight averaging
#   ladder_angeps_waawp + AWP proxy            = the shipped recipe
#
# THIS CELL: anchor only (p = 0), 50 epochs
method : feat_direction
weight_avg : False
featdir_rawteacher : True
featdir_rawstudent : True
featdir_span : random
gain_head : False
dataset : CIFAR100
arch : ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 16
kappa : 0.999
eta : 512
aug : none
eps : 8/255
steps : 10
step_size : 2/255/1
train_eps : 0.03450980392156863
epochs : 50
batch_size : 128
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : False
teacher_norm : False
cyclic : True
checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
