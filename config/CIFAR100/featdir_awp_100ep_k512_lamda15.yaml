# 2026-07-30 (user): FULL 512-dim (subspace mechanism OFF, Q is an isometry) + 100ep + AWP,
# with lamda 1.5. Rationale: k512 at 50ep was clean 63.23 / cw 28.43 / AA 25.98 -- it ties
# the champion on CW while winning clean, so with AWP now working at long schedules the
# question is whether the mechanism-off variant does better with LESS consistency weight.
# eta 512 is set here AND must not be overridden on the CLI. Eval eps 8/255. aa: True.
# Bars: champion (50ep, k350) AA 26.29; 100ep+AWP k350 AA 25.98; ADR-full AA 28.50.
method : feat_direction
featdir_span : random
gain_head : False
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 1.5
beta : 1.0
tau : 16
kappa : 0.999
eta : 512
aug : none
eps : 8/255
steps : 10
step_size : 2/255/1
epochs : 100
batch_size : 128
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : True
awp_style : proxy
awp_gamma : 0.005
awp_warmup : 10
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
