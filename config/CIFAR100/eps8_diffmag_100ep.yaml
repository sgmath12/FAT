# champ_diffeps at the standard training radius (2026-09-24).  The 100-epoch ablations were run at 8.8/255,
# which is not the radius the reported CIFAR results use; this is the same cell at 8/255 so the
# controls sit at the setting the main tables report.
method : feat_direction
featdir_span : random
gain_head : False
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 16
kappa : 0.999
eta : 512
aug : none
eps : 8/255
train_eps : 0.031372549019607843
steps : 10
step_size : 2/255/1
epochs : 100
freeze_lr_epoch : 0.65
wa_start : 0.2
batch_size : 128
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : True
awp_style : proxy
awp_gamma : 0.005
awp_warmup : 10
checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
featdir_angeps_p : 1.0
featdir_eps_signal : difficulty
