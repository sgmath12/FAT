# WEAK TEACHER: 10 clean epochs (2026-09-07).
#
# tab:teacherladder varies the teacher's training length, but 50 to 300 epochs moves its clean
# accuracy only from 75.81 to 78.32, so the paper has no evidence about a genuinely weaker teacher.
# A clean epoch costs 6.8 s, so this rung is minutes.  Train it, read its clean accuracy and its
# class separation, and keep the rungs that land near 50, 60 and 70 percent for the student runs.
#

method : clean
dataset : CIFAR100
arch: ResNet18
optim : SGD

lr : 0.1
alpha : 0.0
beta : 0.0
gamma : 0.0
eta : 0.0
eps : 8/255
steps : 10
step_size : 2/255/1
epochs : 10


batch_size : 128
interval : 5
neptune : True
load : False
finetune : False
evaluate : False
reformation : False
save : False
exp_name: KD
val : False
aug : none
log : True
cyclic : True
data_root : ./data
