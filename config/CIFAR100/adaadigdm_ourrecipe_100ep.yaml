# AdaAD + IGDM ($\alpha = 1$): OUR RECIPE, NO STACK (2026-09-07).
#
# The second half of the recipe controls for tab:natteacher.  Our optimizer, our schedule, our
# natural warm start and our training radius, but no weight averaging and no AWP, which is the base
# regime the anchor is read at (ladder_p0_fh_100ep, 61.29 / 25.36).
#
#   optimizer / schedule   AdamW 0.021, OneCycle
#   initialization         the natural teacher
#   training radius        8.8/255
#

method : adaad_igdm
igdm_alpha : 1.0
igdm_beta : 1.0
igdm_gamma : 1.0
weight_decay : 0.0002
dataset : CIFAR100
arch : ResNet18
optim : AdamW
lr : 0.021
cyclic : True
train_eps : 0.03450980392156863
epochs : 100
batch_size : 128
eps : 8/255
steps : 10
step_size : 2/255/1
weight_avg : False
kappa : 0.999
alpha : 1.0
beta : 1.0
lamda : 0.0
tau : 16
eta : 512
aug : none
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : False
student_norm : False
teacher_norm : False
checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
