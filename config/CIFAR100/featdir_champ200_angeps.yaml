# CHAMPION + ANGULAR-BUDGET EPS (2026-08-04). Champion recipe verbatim, plus featdir_angeps_p 1.0.
# The 50ep bare-regime screen (no WA / no AWP / no freeze_lr / eps 8 uniform) gave:
#   p=1.0  64.59 clean / 28.77 PGD / 27.05 CW / H(CW) 38.13
#   p=0    62.61       / 29.16     / 26.63     / H(CW) 37.37
# i.e. clean +1.98 AND CW +0.42 at IDENTICAL total attack budget (per-sample eps is mean-restored),
# the first intervention in this project to push CW out of the 26.4-26.8 band.
#
# Bar that matters: ADR-full 57.36 / 34.92 / 30.62 / AA 28.50 / NRR 38.08.
# Internal reference: champion 60.74 / 34.94 / 30.53 / AA 28.69 / NRR 38.97.
# Two ways this can fail to transfer, both worth watching:
#   - train_eps here is 8.8/255, not 8/255. The first-order angle ~ eps*||grad|| approximation the
#     allocation rests on is weaker at a larger radius.
#   - AWP already buys CW +0.93 at zero clean cost (featdir_champ200_noawp: 60.73/29.60/AA 28.08).
#     If angeps buys robustness the same way, the two gains overlap instead of adding.
# The 50ep -> champion transfer has failed twice already today, so treat the screen as a hypothesis.
method : feat_direction
featdir_span : random
gain_head : False
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 16
kappa : 0.999
eta : 512
aug : none
eps : 8/255
train_eps : 0.03450980392156863
steps : 10
step_size : 2/255/1
epochs : 100
freeze_lr_epoch : 0.65
wa_start : 0.2
batch_size : 128
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : True
awp_style : proxy
awp_gamma : 0.005
awp_warmup : 10
checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
featdir_angeps_p : 1.0
