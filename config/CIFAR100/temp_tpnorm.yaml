# Teacher-side Lq-norm POWER sweep on the NORM-STUDENT baseline (2026-07-06 night, user request).
# method temperature_tpnorm: target = teacher_logits / (tau * r), r = (||Phi_t||_q / mean)^p.
# p=gamma (0 == train_temperature exactly), q=eta (99+ -> Linf). Mean-normalized r => matched avg
# temperature for every (p,q): the sweep changes only WHICH samples soften, not global softness.
# Old powernorm p-sweep was RAW-student; this closes the norm-student x p x Lq gap. Full 50k train
# (no val) -> fair bar = 41.77 (temp_studentNorm_teacherRaw tau16 seed0). Sweep via --gamma/--eta
# into results/CIFAR100/temp_tpnorm/output.log (parse by gamma,eta).
method : temperature_tpnorm
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
tau : 16
kappa : 0.999
aug : none
eps : 8/255
steps : 3
step_size : 4/255/1
epochs : 50
batch_size : 128
interval : 5
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
