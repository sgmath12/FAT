# Constructing a teacher instead of selecting one (2026-09-20): start from the 50-epoch teacher, the
# one whose student has the best clean accuracy, and train 150 more epochs at a small constant learning
# rate.  The aim is a margin that has saturated like a late teacher's while the feature sensitivity
# stays near the early teacher's -- the combination the window rule never sees on a one-cycle ladder.
method : clean
dataset : CIFAR100
arch: ResNet18
optim : SGD

lr : 0.01
alpha : 0.0
beta : 0.0
gamma : 0.0
eta : 0.0
eps : 8/255
steps : 10
step_size : 2/255/1
epochs : 150


batch_size : 128
interval : 5
neptune : True
load : True
finetune : True
evaluate : False
reformation : False
save : False
exp_name: KD
val : False
aug : none
log : True
cyclic : False
data_root : ./data
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
