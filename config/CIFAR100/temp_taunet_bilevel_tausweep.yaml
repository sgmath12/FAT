# Option B (base tau lowered, user's idea 2026-07-06): same 3-step bilevel taunet as temp_taunet_bilevel.yaml
#   (student_norm=True kept -- the proven +3.3pp-clean mechanism stays on), just sweeping tau lower than 16.
#   Rationale: meta-gradient through the KD target scales like 1/tau^2, so tau=16 may be starving tau_net's
#   own learning signal even though it's fine for the base (non-adaptive) KD loss.
#   Results -> results/CIFAR100/temp_taunet_bilevel_tausweep/output.log. Sweep tau via --tau (12, 6, 4).
method : temperature_taunet_bilevel
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
tau : 12
kappa : 0.999
aug : none
eps : 8/255
steps : 3
step_size : 4/255/1
epochs : 50
batch_size : 128
interval : 5
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
tau_adapt : True
tau_hidden : 64
tau_depth : 2
tau_bn : True
val : True
bilevel_start : 0
bilevel_end : 10
tau_meta_lr : 100
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
aa : False
