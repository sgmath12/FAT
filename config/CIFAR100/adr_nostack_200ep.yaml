# adr_200ep with the stack removed: ADR's own recipe (SGD 0.1, piecewise, 200 epochs) with its SAM-AWP off and no weight averaging. 2026-09-16.
method : adr
adr_ema_decay : 0.995
adr_temp_high : 2.0
adr_temp_low : 1.0
adr_interp_low : 0.7
adr_interp_high : 0.85
dataset : CIFAR100
arch : ResNet18
optim : SGD
lr : 0.1
weight_decay : 0.0005
lr_schedule : piecewise
stage1 : 100
stage2 : 150
lr_factor : 10
cyclic : False
epochs : 200
batch_size : 128
eps : 8/255
steps : 10
step_size : 2/255/1
weight_avg : False
kappa : 0.999
alpha : 1.0
beta : 1.0
lamda : 0.0
tau : 16
eta : 512
aug : none
interval : 5
aa : True
log : True
load : True
finetune : False
evaluate : True
reformation : False
student_norm : False
teacher_norm : False
awp_style : sam
awp_gamma : 0.0
awp_warmup : 0
checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
