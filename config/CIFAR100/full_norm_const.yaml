# CIFAR100 FULL-regime cell: norm const (lamda=5 consistency + weight_avg SWA ON).
# Test whether iso3's isolated +~2pp-clean frontier edge over nonorm survives boosters.
method : DPFAT_adaptive
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 0.7
lamda : 5.0
tau : 0.0
kappa : 0.999
aug : none
eps : 8/255
steps : 3
step_size : 4/255/1
epochs : 50
batch_size : 128
interval : 5
log : True
load : True
finetune : True
evaluate : True
reformation : True
cyclic : True
weight_avg : True
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
