# DEFENSIVE ABLATION: AdaAD given EVERYTHING we use (2026-09-06).
#
# The last cell of the 2x2.  adaad_ourrecipe_100ep gives AdaAD our optimizer, schedule, warm start
# and training radius but no stack; adaad_wa_awp_100ep gives it our stack at its own recipe.  This
# one gives it both, so the only thing left separating it from our shipped row is the objective:
# a logit KL against the teacher read inside the ball, instead of a feature anchor read at the clean
# point.
#
#   optimizer / schedule   AdamW 0.021, OneCycle      (ours)
#   initialization         the natural teacher        (ours)
#   training radius        8.8/255                    (ours)
#   weight averaging       kappa 0.999, from 20%      (ours)
#   AWP proxy              gamma 0.005, warmup 10     (ours)
#
# Read against our 62.17 / 28.86 and against AdaAD's own 59.79 / 23.19.
#

method : adaad
adaad_beta : 1.0
weight_decay : 0.0005
dataset : CIFAR100
arch : ResNet18
optim : AdamW
lr : 0.021
cyclic : True
train_eps : 0.03450980392156863
epochs : 100
batch_size : 128
eps : 8/255
steps : 10
step_size : 2/255/1
weight_avg : True
wa_start : 0.2
awp_gamma : 0.005
awp_warmup : 10
kappa : 0.999
alpha : 1.0
beta : 1.0
lamda : 0.0
tau : 16
eta : 512
aug : none
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : False
student_norm : False
teacher_norm : False
checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
