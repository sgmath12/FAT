# CIFAR100 forward-plan #4: per-feature-dim deviation-selective distillation.
# nonorm base (reformation=False), isolated (lamda=0, weight_avg=False) to compare
# cleanly against iso1_nonorm_const (which is the beta=0 special case of this).
# alpha = const temperature (nonorm raw scale ~13); beta = deviation sharpness.
method : DPFAT_chansel
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 13.0
beta : 1.0
lamda : 0.0
tau : 0.0
kappa : 0.999
aug : none
eps : 8/255
steps : 3
step_size : 4/255/1
epochs : 50
batch_size : 128
interval : 5
log : True
load : True
finetune : True
evaluate : True
reformation : False
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
