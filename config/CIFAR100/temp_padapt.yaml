# IDEA #3 (input-dependent, ARCH-level): LEARNED per-sample normalization strength p(x).
#   Student = ResNet18_zp: Phi_hat = Phi/||Phi||^{p(x)}, p(x)=sigmoid(p_head(Phi)), zero-init (p=0.5).
#   p(x)->1 everywhere = full L2 norm (iso3 confirmed lever); p(x)->0 = raw student.
#   Per-epoch p(x) stats logged to output.log (p_mean/p_std/p5/p50/p95) — the observable.
#   Base = temp_studentNorm_teacherRaw tau=16, isolated (lamda=0, weight_avg=False).
#   Results -> results/CIFAR100/temp_padapt/output.log.
method : temperature_padapt
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
tau : 16
kappa : 0.999
aug : none
eps : 8/255
steps : 3
step_size : 4/255/1
epochs : 50
batch_size : 128
interval : 5
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
p_adapt : True
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
