# CHAMPION STACK x SHARP HEAD TARGET (2026-08-02, user q). Identical to featdir_champ200_100ep
# except tau 16 -> 1, i.e. the head KL target is the teacher's RAW logits instead of z_t/16.
# Teacher logit scale is ~||phi_t||*||w_c|| = 11.23*1.46 ~ 16, so softmax(z_t) is nearly one-hot:
# this cell is "KD to the teacher's hard prediction", sitting between CE(true label) and KD tau16.
#
# Why: in the 50ep grid, swapping the head from CE to KL moved PGD-20 by +3.1..+3.5 while CW moved
# only +0.15..+0.40 -- on a BIT-IDENTICAL backbone (dir_loss 56.9736 in both, detach means the head
# cannot reach the backbone). That signature says the soft target weakens CE-based attacks rather
# than adding robustness. If tau=1 loses the PGD gain, smoothing is the whole story and the head
# axis is a measurement artifact. If it keeps it, the teacher's distribution is doing real work.
# Bar: 60.74 clean / 34.94 PGD-20 / 30.53 CW / 28.69 AA.
# Note beta stays 1.0; a peaked target makes the KL term numerically larger, so watch for instability.
method : feat_direction
featdir_span : random
gain_head : False
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 1
kappa : 0.999
eta : 512
aug : none
eps : 8/255
train_eps : 0.03450980392156863
steps : 10
step_size : 2/255/1
epochs : 100
freeze_lr_epoch : 0.65
wa_start : 0.2
batch_size : 128
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : True
awp_style : proxy
awp_gamma : 0.005
awp_warmup : 10
checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
