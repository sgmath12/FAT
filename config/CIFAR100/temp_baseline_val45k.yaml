# CONTROL for the post-valfix bilevel family (2026-07-06): plain temperature baseline (tau16, the
# 41.77-H cell) but with val: True, so it trains on the SAME 45000-image split the fixed main.py now
# gives every val:True (bilevel) run. Purpose: the old 41.77 baseline used all 50000; comparing any
# new bilevel run against it confounds the method with a 10% data gap. THIS run is the fair bar.
method : temperature
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
tau : 16
kappa : 0.999
aug : none
eps : 8/255
steps : 3
step_size : 4/255/1
epochs : 50
batch_size : 128
interval : 5
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
val : True
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
aa : False
