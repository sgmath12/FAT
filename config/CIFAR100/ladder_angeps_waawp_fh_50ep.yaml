# LADDER RUNG IN THE SHIPPED DESIGN, 50 EPOCHS: the full stack: + AWP (2026-09-05).
#
# The 100-epoch block was rebuilt with featdir_freeze_head on, because the old ladder measured every
# component with the classifier head trained where the shipped recipe freezes it.  That left the two
# blocks of tab:ladder in different designs, which matters: the table's claim that AWP changes sign
# with schedule length compares -0.25 NRR at 50 epochs against +1.08 at 100, and a comparison across
# blocks is confounded the moment the blocks stop matching.  This rebuilds the 50-epoch block so the
# sign change is read within one design.
#
# Only line changed from ladder_angeps_waawp_50ep: featdir_freeze_head True.

method : feat_direction
featdir_freeze_head : True
featdir_angeps_p : 1.0
featdir_rawteacher : True
featdir_rawstudent : True
featdir_span : random
gain_head : False
dataset : CIFAR100
arch : ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 16
kappa : 0.999
eta : 512
aug : none
eps : 8/255
steps : 10
step_size : 2/255/1
train_eps : 0.03450980392156863
epochs : 50
wa_start : 0.2
batch_size : 128
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : False
teacher_norm : False
cyclic : True
weight_avg : True
awp_style : proxy
awp_gamma : 0.005
awp_warmup : 10
checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
