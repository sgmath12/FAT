# MMA MARGIN SIGNAL ON THE SHIPPED RECIPE (2026-09-04)
#
# Companion to `champ_diffrank_l2` / `champ_p0_l2`.  The queued `champ_margineps` carries
# `student_norm: True` and `freeze_lr_epoch: 0.65`, i.e. the pre-2026-08-31 directional design, so
# its number cannot be cited in Section 3, which describes the shipped raw-L2 recipe.  This config is
# byte-identical to `l2_bestrecipe_freezehead` except for the single line below.
#
# ONLY LINE CHANGED: featdir_eps_signal = margin
#
# Same exponent p=1, same [0.5, 1.5] clamp, same mean restoration, therefore the same total attack
# budget N*eps -- only the per-sample signal differs.  Read against l2_bestrecipe_freezehead
# (62.17 / 32.37 / 30.93 / 28.86 / 39.42) and against champ_p0_l2 (uniform, running).
#
# MMA's actual criterion: g_i = logit margin z_y - max_{c != y} z_c, inverted so a large margin
# earns a large radius under the shared mean/g form.

method : feat_direction
featdir_freeze_head : True
featdir_angeps_p : 1.0
featdir_eps_signal : margin
featdir_rawteacher : True
featdir_rawstudent : True
featdir_span : random
gain_head : False
dataset : CIFAR100
arch : ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 16
kappa : 0.999
eta : 512
aug : none
eps : 8/255
steps : 10
step_size : 2/255/1
train_eps : 0.03450980392156863
epochs : 100
wa_start : 0.2
batch_size : 128
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : False
teacher_norm : False
cyclic : True
weight_avg : True
awp_style : proxy
awp_gamma : 0.005
awp_warmup : 10
checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
