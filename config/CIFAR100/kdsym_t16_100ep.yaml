# CONVENTIONAL KD, tau = 16 AT 100 EPOCHS AND train_eps 8.8/255, NO STACK (2026-09-08).
#
# The base-regime tie between the anchor and the logit MSE (62.72 / 25.88 against 62.59 / 25.69) is
# measured at 50 epochs and eps 8/255, while every other cell in the paper -- the ladder, the label-CE
# control, the shipped row -- trains at 8.8/255 for 100 epochs.  Before asking what the stack does to
# that tie, it has to be shown to survive the change of scale on its own, which is what this cell is
# for.  No weight averaging and no AWP, so the pair for it is ladder_p0_fh_100ep (61.29 / 25.36).
#

method : temperature
kd_symmetric : True
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 16
kappa : 0.999
aug : none
eps : 8/255
steps : 10
step_size : 2/255/1
train_eps : 0.03450980392156863
epochs : 100
batch_size : 128
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : False
student_norm : False
teacher_norm : False
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
