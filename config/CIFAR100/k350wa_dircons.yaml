# MATCHED-ADVERSARY cell (user, 2026-07-15): k350+WA with the dir+consistency hybrid attack
# (inner objective = ||Q^T d||^2 + w*KL(model(xa)||model(x).sg), TRADES-style second term).
# Fixes lamda's inertness on featdir (adversary never stressed the term; g_cons ~4e-6).
# Sweep lamda via --lamda on top; bar k350+WA lamda0 62.61/33.67/cw28.00.
method : feat_direction
featdir_attack : dircons
featdir_atk_cons : 1.0
featdir_span : random
gain_head : False
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 16
kappa : 0.999
aug : none
eps : 8/255
steps : 10
step_size : 2/255/1
epochs : 50
batch_size : 128
interval : 5
aa : False
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : True
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
