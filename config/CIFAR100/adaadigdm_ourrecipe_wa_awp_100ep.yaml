# ADAAD + IGDM (alpha = 1) GIVEN EVERYTHING WE USE (2026-09-06).
#
# Completing the recipe controls: each published distillation objective is run not only at its own
# recipe with our natural teacher (tab:natteacher) but with our optimizer, our schedule, our warm
# start, our training radius AND our stack, so that the only thing left between it and our shipped
# row is the objective itself.
#
#   optimizer / schedule   AdamW 0.021, OneCycle      (ours)
#   initialization         the natural teacher        (ours)
#   training radius        8.8/255                    (ours)
#   weight averaging       kappa 0.999, from 20%      (ours)
#   AWP proxy              gamma 0.005, warmup 10     (ours)
#
# Read against our 62.17 / 28.86, against the anchor without the radius rule
# (ladder_p0_wa_awp_fh_100ep) and against this method's own-recipe row.
#

method : adaad_igdm
igdm_alpha : 1.0
igdm_beta : 1.0
igdm_gamma : 1.0
weight_decay : 0.0002
dataset : CIFAR100
arch : ResNet18
optim : AdamW
lr : 0.021
cyclic : True
train_eps : 0.03450980392156863
epochs : 100
batch_size : 128
eps : 8/255
steps : 10
step_size : 2/255/1
weight_avg : True
wa_start : 0.2
awp_gamma : 0.005
awp_warmup : 10
kappa : 0.999
alpha : 1.0
beta : 1.0
lamda : 0.0
tau : 16
eta : 512
aug : none
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : False
student_norm : False
teacher_norm : False
checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
