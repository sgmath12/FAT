# ADR: OWN RECIPE, NATURAL-TEACHER INITIALIZATION, + WEIGHT AVERAGING AND AWP (2026-09-13).
#
# The control the stack objection actually calls for: the method's own optimizer, schedule, epoch
# budget and radius stay exactly as its authors set them; the student starts from our natural teacher
# (layer two of tab:main), and our stack is added on top -- weight averaging with kappa 0.999 from 20%
# of the run and the AWP proxy with gamma 0.005.  The AWP warmup is scaled to 10% of this method's
# own epoch count (20 of 200), which is what warmup 10 is on our 100-epoch schedule.
#
# ADR's own full configuration (AT + WA + AWP + ADR) already carries both components, so this
# cell is that configuration with the natural-teacher initialization; its SAM-style AWP is kept.
#
# Copying our optimizer, schedule and epochs as well is a different question, answered by
# tab:fullmatch if it is asked.
#

method : adr
adr_ema_decay : 0.995
adr_temp_high : 2.0
adr_temp_low : 1.0
adr_interp_low : 0.7
adr_interp_high : 0.85
dataset : CIFAR100
arch : ResNet18
optim : SGD
lr : 0.1
weight_decay : 0.0005
lr_schedule : piecewise
stage1 : 100
stage2 : 150
lr_factor : 10
cyclic : False
epochs : 200
batch_size : 128
eps : 8/255
steps : 10
step_size : 2/255/1
weight_avg : True
wa_start : 0.2
kappa : 0.999
alpha : 1.0
beta : 1.0
lamda : 0.0
tau : 16
eta : 512
aug : none
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : False
student_norm : False
teacher_norm : False
awp_style : sam
awp_gamma : 0.005
awp_warmup : 0
checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
