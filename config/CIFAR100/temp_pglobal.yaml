# ABLATION for #3: LEARNED GLOBAL scalar p (one parameter, shared by all samples).
#   Completes the 3-way: p=1 fixed (baseline) vs p* global-learned (THIS) vs p(x) per-sample (temp_padapt).
#   Student = ResNet18_zpg: Phi_hat = Phi/||Phi||^p, p = sigmoid(p_logit), zero-init (p=0.5 start).
#   Reuses method temperature_padapt (same loop; p stats logged per epoch, std==0 here by construction).
#   Base = temp_studentNorm_teacherRaw tau=16, isolated (lamda=0, weight_avg=False).
#   Results -> results/CIFAR100/temp_pglobal/output.log.
method : temperature_padapt
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
tau : 16
kappa : 0.999
aug : none
eps : 8/255
steps : 3
step_size : 4/255/1
epochs : 50
batch_size : 128
interval : 5
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
p_global : True
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
