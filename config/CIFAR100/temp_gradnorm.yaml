# Per-sample TEACHER INPUT-GRADIENT-NORM-modulated temperature (user's idea, 2026-07-05, their preferred
#   teacher-only signal). method train_temperature_gradnorm.
#   g(x) = ||d CE(teacher(x),y)/dx||_2 at the CLEAN point (one backward pass, no attack). STUDENT NEVER
#   APPEARS in this signal -- purely a frozen-teacher property, matching the philosophy: keep natural
#   teacher's clean knowledge, calibrate toward robustness ONLY from the teacher's own signal.
#   T(x) = tau * exp(gamma * zscore(g)). gamma>0 = high-gradient (fragile) softer, gamma<0 = sharper.
#   gamma=0 & swap on == swap-baseline 42.17 (control). student L2-norm, teacher raw. steps=3.
#   knobs: tau=T0, gamma (signed, via --gamma), vuln_swap. Results -> results/CIFAR100/temp_gradnorm/output.log
method : temperature_gradnorm
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
tau : 16
gamma : 0.3
vuln_swap : True
kappa : 0.999
aug : none
eps : 8/255
steps : 3
step_size : 4/255/1
epochs : 50
batch_size : 128
interval : 5
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
