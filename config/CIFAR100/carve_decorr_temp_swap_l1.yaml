# decorr carve + global temperature + teacher SWAP-rectification. method train_carve_decorr_temp_swap_l1.
#   target = rectify_swap(teacher.linear(Phi_t*w), y) / T. carve protects teacher's own class dims (pred),
#   swap moves true class to top on wrong samples, T softens. student L2-norm, teacher raw, NO /13. steps=3.
#   knobs: tau=carve strength, beta=class protect, temperature=T. Compare vs temp_studentNorm_teacherRaw_swap.
# Results -> results/CIFAR100/carve_decorr_temp_swap_l1/output.log. Sweep via --tau/--beta/--temperature.
method : carve_decorr_temp_swap_l1
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
beta : 0.1
gamma : 2
temperature : 16
lamda : 0.0
tau : 0.5
kappa : 0.999
aug : none
eps : 8/255
steps : 3
step_size : 4/255/1
epochs : 50
batch_size : 128
interval : 5
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
