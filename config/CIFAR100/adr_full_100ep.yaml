# ADR WITH EVERYTHING OUR ROW HAS (2026-09-11).
#
# Layer three of tab:main: our optimizer (AdamW 0.021 under one cycle), our natural warm start, our
# training radius 8.8/255, and our stack (weight averaging kappa 0.999 from 20%, AWP proxy gamma
# 0.005 after epoch 10).  Read against our shipped 62.17 / 28.86.
#
# Also moved from 200 epochs to our 100, and from ADR's SAM-style AWP to our proxy, so the
# cell is our stack rather than a mixture of the two.

method : adr
adr_ema_decay : 0.995
adr_temp_high : 2.0
adr_temp_low : 1.0
adr_interp_low : 0.7
adr_interp_high : 0.85
dataset : CIFAR100
arch : ResNet18
optim : AdamW
lr : 0.021
weight_decay : 0.0005
cyclic : True
train_eps : 0.03450980392156863
epochs : 100
batch_size : 128
eps : 8/255
steps : 10
step_size : 2/255/1
weight_avg : True
awp_gamma : 0.005
awp_warmup : 10
awp_style : proxy
wa_start : 0.2
kappa : 0.999
alpha : 1.0
beta : 1.0
lamda : 0.0
tau : 16
eta : 512
aug : none
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : False
student_norm : False
teacher_norm : False
checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
