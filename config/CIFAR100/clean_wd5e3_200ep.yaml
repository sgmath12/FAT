# Natural teacher for the teacher-selection analysis (2026-09-19): same schedule as clean_200ep with
# one change (weight_decay : 0.005), to move the teacher's geometry while keeping its clean accuracy close.
method : clean
dataset : CIFAR100
arch: ResNet18
optim : SGD

lr : 0.1
alpha : 0.0
beta : 0.0
gamma : 0.0
eta : 0.0
eps : 8/255
steps : 10
step_size : 2/255/1
epochs : 200


batch_size : 128
interval : 5
neptune : True
load : False
finetune : False
evaluate : False
reformation : False
save : False
exp_name: KD
val : False
aug : none
log : True
cyclic : True
data_root : ./data
weight_decay : 0.005
