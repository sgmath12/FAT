# ANGEPS, AS DERIVED (2026-08-21).  T.5 argues from the L-infinity dual norm: the first-order angle
# a sample moves inside an L-inf ball of radius e is max_{||d||_inf <= e} <grad, d> = e * ||grad||_1,
# so equalizing the ANGULAR budget calls for the L1 gradient norm.  Every logged angeps run,
# champion included, used the L2 norm -- `featdir_angeps_gnorm` defaults to 2 because the
# 2026-08-04 run that discovered the effect used L2 and every later run stayed reproducible with it.
# The derivation and the implementation have therefore never agreed, and the code comment says so.
#
# That is tolerable while angeps is one knob among many.  It is not tolerable if angeps is a
# headline contribution with the derivation printed next to it: a reader who checks will find L2.
# This cell is the champion with the one line the derivation actually asks for.
#
# Champion (gnorm 2): 62.17 / PGD 34.77 / CW 30.92 / AA 28.59 / NRR 39.17.
#   better  -> new champion, and the derivation is vindicated.
#   tied    -> report that the allocation is insensitive to the norm choice at first order, and the
#              derivation can be printed honestly with that footnote.
#   worse   -> the effect is not the derived one; drop the L1 derivation from the paper and present
#              angeps as an empirical allocation rule.
#
method : feat_direction
featdir_span : random
gain_head : False
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 16
kappa : 0.999
eta : 512
aug : none
eps : 8/255
train_eps : 0.03450980392156863
steps : 10
step_size : 2/255/1
epochs : 100
freeze_lr_epoch : 0.65
wa_start : 0.2
batch_size : 128
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : True
awp_style : proxy
awp_gamma : 0.005
awp_warmup : 10
checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
featdir_angeps_p : 1.0
featdir_angeps_gnorm : 1
