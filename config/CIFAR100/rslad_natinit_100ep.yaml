# RSLAD: OWN RECIPE, NATURAL-TEACHER INITIALIZATION (2026-09-07).
#
# tab:natteacher hands each published objective our natural teacher as its TARGET, but every one of
# those cells starts from a random initialization (`finetune: False`).  Our own cells warm-start from
# the teacher, so "you also initialize from the natural network" is a live objection and the table
# cannot answer it: the only cells that carry the warm start also change the optimizer and the
# schedule, which confounds the two.
#
# This cell changes `finetune` alone.  Everything else is the method's own published recipe: SGD 0.1,
# piecewise decay at 70 and 90, weight decay 2e-4, eps 8/255, 100 epochs, no weight averaging, no AWP.
#

method : rslad
rslad_scale : 10.0
rslad_w_adv : 0.8333333333333334
weight_decay : 0.0002
dataset : CIFAR100
arch : ResNet18
optim : SGD
lr : 0.1
lr_schedule : piecewise
stage1 : 70
stage2 : 90
lr_factor : 10
cyclic : False
epochs : 100
batch_size : 128
eps : 8/255
steps : 10
step_size : 2/255/1
weight_avg : False
kappa : 0.999
alpha : 1.0
beta : 1.0
lamda : 0.0
tau : 16
eta : 512
aug : none
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : False
student_norm : False
teacher_norm : False
checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
