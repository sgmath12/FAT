# NO-DECAY DISCRIMINATING TEST (2026-07-13): identical to temp_gainhead.yaml except log_g is
# exempted from AdamW weight decay (nodecay_logscale). If g now grows ~5x and H recovers toward
# 41.77 -> the -1.8 of gainhead AND coshead re-attributes to the blocked SCALE channel; if H
# stays ~40 -> per-class head direction freedom is genuinely load-bearing.
# GAIN-ONLY head cell (user's Gram-Schmidt-as-parametrization idea, 2026-07-13).
#   Student head w_s,c = exp(log_g_c) * w_t,c: direction FROZEN at the teacher head (finetune
#   load), only 100 per-class gains (+bias) learn. Completes the head-side 2x2:
#   {dir free, |w| free} = baseline 41.77 / {dir free, |w| frozen} = coshead 40.01 (LOSS) /
#   {dir frozen, |w| free} = THIS. KL pipeline verbatim (train_temperature + gain logging) so the
#   comparison vs baseline/coshead is head-parametrization-only. Registered prediction: tie/small
#   loss (diag_head_rotation.py: baseline head rotation = one shared 512-d rotation, backbone-
#   absorbable; per-class direction residual only ~25%). 3-step; bar = 41.77 H (tau16 seed0).
method : temperature_gainhead
nodecay_logscale : True
gain_head : True
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
tau : 16
kappa : 0.999
aug : none
eps : 8/255
steps : 3
step_size : 4/255/1
epochs : 50
batch_size : 128
interval : 5
aa : False
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
