# SWAP-BASELINE: global-temp baseline (student-norm + teacher softening) + teacher swap-rectification.
#   method train_temperature_swap: target = rectify_swap(teacher_logits, y) / tau. tau = global temp.
#   Fair swap-baseline to compare carve_decorr_temp_swap against (both get rectify). tau=16 (best). steps=3.
# Results -> results/CIFAR100/temp_studentNorm_teacherRaw_swap/output.log. Sweep tau via --tau.
method : temperature_swap
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
tau : 16
kappa : 0.999
aug : none
eps : 8/255
steps : 3
step_size : 4/255/1
epochs : 50
batch_size : 128
interval : 5
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
