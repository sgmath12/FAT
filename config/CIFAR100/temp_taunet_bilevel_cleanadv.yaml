# Bilevel TauNet, meta loss = CE(adv) + CE(clean) (user's idea, 2026-07-05): the "adv"-only meta loss
#   (temp_taunet_bilevel.yaml, H=41.59) only rewards held-out ROBUST accuracy -- tau could in principle
#   buy robustness by letting clean accuracy suffer. This variant adds a clean-accuracy term to the meta
#   objective so tau_net is only rewarded when robust gains don't come at clean's expense (or clean also
#   improves). Same v5 base otherwise: real AdamW backbone step + SGD-only tau_net update + window 0-10,
#   tau_center: True (geomean pinned at config.tau, since we're testing the meta-loss axis here, not the
#   free-global-level axis from temp_taunet_bilevel_freemean.yaml).
method : temperature_taunet_bilevel
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
tau : 16
kappa : 0.999
aug : none
eps : 8/255
steps : 3
step_size : 4/255/1
epochs : 50
batch_size : 128
interval : 5
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
tau_adapt : True
tau_hidden : 64
tau_depth : 2
tau_bn : True
val : True
bilevel_start : 0
bilevel_end : 10
tau_meta_lr : 100
bilevel_meta_loss : cleanadv
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
aa : False
