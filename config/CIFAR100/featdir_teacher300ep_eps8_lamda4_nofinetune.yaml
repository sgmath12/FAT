# 2026-07-22: ablation on the current best (300ep-teacher champion, train_eps=8/255, lamda=4,
# H(cw)=39.76) -- finetune: False, i.e. the student starts from RANDOM init instead of being
# warm-started from the natural clean checkpoint. Teacher is still loaded normally (load: True);
# only the student's initialization changes. Tests how much the clean-pretrain warm-start
# actually buys vs training the student from scratch under the same distillation loss.
method : feat_direction
featdir_span : random
gain_head : False
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 16
kappa : 0.999
aug : none
eps : 8/255
steps : 10
step_size : 2/255/1
epochs : 50
batch_size : 128
interval : 5
aa : False
log : True
load : True
finetune : False
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : True
checkpoint : CIFAR100/checkpoint/clean_300ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_300ep/clean_last.pkl
data_root : ./data
