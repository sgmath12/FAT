# FROZEN-HEAD LOGIT MSE, lr = 0.021 (2026-09-08).
#
#     L = E_x || h_t(Phi_s(x_adv)) - h_t(Phi_t(x)) ||^2
#
# The temperature-free half of the logits-versus-features question.  Both this cell and the feature
# anchor inherit the teacher's classifier and never train it, and neither uses a softmax or a
# temperature, so the comparison is between supervising the logits and supervising the features --
# and with the head frozen this objective is exactly the anchor composed with W, which constrains
# only what the classifier is sensitive to.
#
# The two losses have different gradient scales, so the learning rate is swept (0.007, 0.021, 0.042) and the
# comparison uses each side's best rather than a shared default.  Everything else is the anchor's
# base regime: 50 epochs, AdamW under one cycle, natural warm start, eps 8/255, no stack.
#

method : logit_mse
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 1
kappa : 0.999
eta : 512
aug : none
eps : 8/255
steps : 10
step_size : 2/255/1
epochs : 50
batch_size : 128
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : False
student_norm : False
teacher_norm : False
teacher_cos_head : False
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
