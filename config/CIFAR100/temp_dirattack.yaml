# KL-outer x DIR-attack cell (2026-07-13): completes the {outer loss} x {inner attack} 2x2.
# Baseline train_temperature loss, but the adversary maximizes the feature-direction loss.
# KL/KL 41.77, dir/dir 39.93, dir/KL 39.79 -> if THIS stays ~41.7 the classification-aware
# advantage is in the TRAINING gradient, not the attack. tau 16 fixed.
method : temperature_dirattack
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
tau : 16
kappa : 0.999
aug : none
eps : 8/255
steps : 3
step_size : 4/255/1
epochs : 50
batch_size : 128
interval : 5
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
