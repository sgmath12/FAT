# PAPER-BASE 2x2, cell snorm/traw (2026-08-09, theory_experiment_necessary.md Phase 1).
# ||s_hat - phi_t||^2 = 1 + ||phi_t||^2 - 2||phi_t||cos: still direction-only in the student,
# = a cosine loss with per-sample weight ||phi_t|| (teacher confidence). Predicted to tie the
# reference cell (top row of the 2x2). See plan file for registered predictions.
method : feat_direction
featdir_rawteacher : True
featdir_rawstudent : False
featdir_span : random
gain_head : False
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 16
kappa : 0.999
eta : 512
aug : none
eps : 8/255
steps : 10
step_size : 2/255/1
epochs : 100
batch_size : 128
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
