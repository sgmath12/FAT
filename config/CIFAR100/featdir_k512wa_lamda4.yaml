# k=512 CONTROL for the champion (2026-07-29, user q): identical to the champion
# k350+WA+lamda4 (10-step, tau16/beta1/eps8/kappa0.999) except the random span uses the FULL
# 512-dim feature space -- i.e. no capacity reservation / no free subspace. Isolates whether
# the 162-dim free space is doing the work. Champion bar: clean 62.75 / pgd20 33.96 / cw 28.41.
# (Old k=512 point on the pre-WA/pre-lamda pipeline was pgd 28.91.)
method : feat_direction
featdir_span : random
gain_head : False
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 4.0
beta : 1.0
tau : 16
kappa : 0.999
eta : 512
aug : none
eps : 8/255
steps : 10
step_size : 2/255/1
epochs : 50
batch_size : 128
interval : 5
aa : False
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : True
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
