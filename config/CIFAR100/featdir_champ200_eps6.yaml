# EPS_TR SWEEP (2026-08-08), train_eps = 6/255.  Champion recipe verbatim otherwise.
# Serves three purposes at once:
#   1. the clean/robust Pareto curve the trade-off claim (P2) needs -- one point is not a curve;
#   2. Theorem 1's threshold prediction: the adversarial term is an L1 penalty on the
#      non-robust coefficient, so below a threshold eps the student KEEPS non-robust
#      features.  In model coordinates eps_0 in (0.5eta, 1.0eta) and the champion's
#      8.8/255 corresponds to 2eta, so the predicted knee is near 4.4/255 -- 4 and 6
#      bracket it, 11 and 14 extend the curve on the other side;
#   3. evidence that 8.8/255 is not a tuned sweet spot.
# aa: False (sweep convention).  AA on the points that enter the figure, as a later batch.
method : feat_direction
featdir_span : random
gain_head : False
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 16
kappa : 0.999
eta : 512
aug : none
eps : 8/255
train_eps : 0.023529411764705882
steps : 10
step_size : 2/255/1
epochs : 100
freeze_lr_epoch : 0.65
wa_start : 0.2
batch_size : 128
interval : 5
aa : False
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : True
awp_style : proxy
awp_gamma : 0.005
awp_warmup : 10
checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
featdir_angeps_p : 1.0
