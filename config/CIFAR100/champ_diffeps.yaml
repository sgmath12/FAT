# THE BASELINE T.5 CLAIMS TO DIFFER FROM (2026-08-22).
#
# T.5 says the contribution is not per-sample eps as such -- IAAT (1910.08051), MMA (1812.02637)
# and CAT (2002.06789) all assign a per-sample radius -- but WHAT the radius is allocated from:
# the input-sensitivity of the training loss, rather than the sample's difficulty or its
# input-space margin.  That comparison had never been run, which at a top venue is a missing
# experiment rather than a weakness.
#
# Reimplementing those methods end-to-end would compare recipes, not allocation rules.  This cell
# instead swaps ONLY the per-sample signal, in place: same exponent p = 1, same [0.5, 1.5] clamp,
# same mean restoration (so total budget is still N * eps), same everything downstream.
#   ours       g_i = ||grad_x L_dir(x_i)||          -> sensitivity of the objective
#   this cell  g_i = per-sample CE on clean x_i     -> difficulty; easy samples get the larger
#                                                     radius, the direction IAAT/CAT assign it
#
# Read against featdir_champ200_angeps (62.17 / PGD 34.77 / CW 30.92 / AA 28.59 / NRR 39.17) and
# against p=0 (60.74 / 34.94 / 30.53 / 28.69 / 38.97):
#   difficulty ~ p=0        -> difficulty allocation does nothing, and the sensitivity signal is
#                              specifically what works.  This is the outcome T.5 needs.
#   difficulty ~ ours       -> any sensible per-sample allocation would have done; the contribution
#                              is per-sample eps itself, which is NOT new, and T.5 must be rewritten.
#   difficulty > ours       -> we picked the worse signal.
#
method : feat_direction
featdir_span : random
gain_head : False
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 16
kappa : 0.999
eta : 512
aug : none
eps : 8/255
train_eps : 0.03450980392156863
steps : 10
step_size : 2/255/1
epochs : 100
freeze_lr_epoch : 0.65
wa_start : 0.2
batch_size : 128
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : True
awp_style : proxy
awp_gamma : 0.005
awp_warmup : 10
checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
featdir_angeps_p : 1.0
featdir_eps_signal : difficulty
