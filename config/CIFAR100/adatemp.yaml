# CIFAR100 search: NON-normalization per-sample adaptive temperature (nonorm base, isolated).
# T_i = alpha * (signal_i/mean), signal via env FAT_ADASIGNAL {uniform,norm,margin,maxprob,dev}.
# uniform == iso1 nonorm-const baseline; norm == normalization (control); margin/maxprob/dev = novel.
method : DPFAT_adatemp
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 13.0
lamda : 0.0
tau : 0.0
kappa : 0.999
aug : none
eps : 8/255
steps : 3
step_size : 4/255/1
epochs : 50
batch_size : 128
interval : 5
log : True
load : True
finetune : True
evaluate : True
reformation : False
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
