# GOLDEN-LOGIT combo: eps-ball smooth (flat) + swap-rectify (correct) + temperature (soft).
#   method train_smooth_temp_swap. target = rectify_swap( mean_K teacher(x+delta), y ) / T.
#   student L2-norm, teacher raw, NO /13. steps=3. knobs: temperature=T, smooth_k=K.
# Results -> results/CIFAR100/smooth_temp_swap/output.log. Compare vs swap-baseline 42.17 / smooth_temp.
method : smooth_temp_swap
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
tau : 1
temperature : 16
smooth_k : 8
kappa : 0.999
aug : none
eps : 8/255
steps : 3
step_size : 4/255/1
epochs : 50
batch_size : 128
interval : 5
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
