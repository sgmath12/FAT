# EPOCH SENSITIVITY: the shipped recipe at 200 epochs (2026-09-07).
#
# The paper reports 50 and 100 epochs and nothing else, so "the result is a 100-epoch artifact" has
# no answer in it.  This cell changes `epochs` alone; wa_start is a fraction (0.2) and awp_warmup is
# an epoch count, both of which are left as they are so that the recipe is the same recipe.
#

method : feat_direction
featdir_freeze_head : True
featdir_angeps_p : 1.0
featdir_rawteacher : True
featdir_rawstudent : True
featdir_span : random
gain_head : False
dataset : CIFAR100
arch : ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 16
kappa : 0.999
eta : 512
aug : none
eps : 8/255
steps : 10
step_size : 2/255/1
train_eps : 0.03450980392156863
epochs : 200
wa_start : 0.2
batch_size : 128
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : False
teacher_norm : False
cyclic : True
weight_avg : True
awp_style : proxy
awp_gamma : 0.005
awp_warmup : 10
checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
