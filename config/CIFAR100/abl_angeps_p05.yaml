# C4: sensitivity-matched eps exponent sweep (2026-09-01).  p=0 and p=1 are the ladder's first two
# rows; these fill in between and beyond, so that "no hyperparameter" can be stated as a measured
# plateau rather than as a claim about a single point.  Base regime.
#
# THIS CELL: p = 0.5.

method : feat_direction
