# cos 2x2 cell (4): COSINE student + COSINE teacher = FULL Directional Distillation.
#   directional supervision (teacher s_t*cos target) INTO a directional parametrization (student
#   s*cos head). See temp_costeacher.yaml / temp_coshead.yaml for each axis. Fair bar: 50k H 41.77.
method : temperature_costeacher
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
tau : 16
kappa : 0.999
aug : none
eps : 8/255
steps : 3
step_size : 4/255/1
epochs : 50
batch_size : 128
interval : 5
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cos_head : True
val : False
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
aa : False
