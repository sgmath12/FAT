# The missing cell of the base-regime table (2026-08-23): feature anchor WITH the head-KD term at
# tau 16, i.e. the shipped objective, with AA measured.
#
# `n2_traw_sraw` is this configuration and gave 62.86 / PGD 32.36 / CW 27.18, but it ran with
# aa: False and its checkpoint predates the 2026-08-17 `_last.pkl` fix, so no usable AA exists for
# it.  Without that number the table cannot say whether deleting the head term is neutral or an
# improvement -- the no-head cell reached AA 25.88 / NRR 36.53 and the tau=1 cell 23.93 / 34.58, so
# the head term is somewhere between harmless and harmful and this decides which.
#
# THIS CELL: feature anchor, head KD at tau 16, AA on.
method : feat_direction
featdir_span : random
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 16
kappa : 0.999
eta : 512
aug : none
eps : 8/255
steps : 10
step_size : 2/255/1
epochs : 50
batch_size : 128
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : False
student_norm : False
teacher_norm : False
teacher_cos_head : False
featdir_normfeat_target : False
featdir_rawteacher : True
featdir_rawstudent : True
featdir_head_ce : False
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
