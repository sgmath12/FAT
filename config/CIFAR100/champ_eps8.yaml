# TRAINING-RADIUS ABLATION ON THE CHAMPION RECIPE (2026-08-31).
#
# The shipped recipe trains at eps_train = 8.8/255 and evaluates at 8/255.  8.8 is a non-standard
# number and a reviewer will ask where it came from, so this sweep runs the SAME recipe at the
# standard 8/255 and at 10/255, changing nothing else.  Evaluation stays at 8/255 in every cell, as
# in the Tiny-ImageNet precedent `featdir_tin_eps10`.
#
# There is no prior CIFAR evidence for this axis -- the old `featdir_awp_100ep_eps10` also moved the
# recipe (lambda 1.5 and others) so it cannot be read as an eps ablation (TODO.md:39).
#
# Design: raw-L2 anchor (`student_norm: False`) with `featdir_freeze_head: True`, i.e. the champion as
# of today.  Freezing the head was verified on CIFAR-100 this morning -- 62.65 / 28.77 / NRR 39.43
# against 62.35 / 28.68 / 39.29 with the detached head-KD term -- and it is what the method section
# describes, so tau and beta are absent from the method entirely.
#
# THIS CELL: CIFAR-100, eps_train = 8/255 (the standard).  Reference at 8.8: 62.65 / 28.77 / 39.43.

method : feat_direction
featdir_freeze_head : True
featdir_angeps_p : 1.0
featdir_rawteacher : True
featdir_rawstudent : True
featdir_span : random
gain_head : False
dataset : CIFAR100
arch : ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 16
kappa : 0.999
eta : 512
aug : none
eps : 8/255
steps : 10
step_size : 2/255/1
train_eps : 0.031372549019607843
epochs : 100
wa_start : 0.2
batch_size : 128
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : False
teacher_norm : False
cyclic : True
weight_avg : True
awp_style : proxy
awp_gamma : 0.005
awp_warmup : 10
checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
