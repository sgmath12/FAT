# TEACHER LADDER, WEAK RUNG: 5-epoch natural teacher (2026-09-09).
#
# The published ladder spans 50 to 300 clean epochs, which moves the teacher's accuracy over only
# 2.5 points (75.81 to 78.32), so the paper cannot say what a genuinely weaker teacher does.  These
# rungs extend it downward.  The student is unchanged in every field: 50 epochs, AdamW 0.021 under
# one cycle, warm start from the same teacher it reads, eps 8/255, no stack, head inherited.
#
# Read with tladder_clean (50ep teacher), tladder_clean_100ep/150ep/300ep and tausens_fd_nohd (200ep).
#

method : feat_direction
featdir_freeze_head : True
featdir_span : random
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 16
kappa : 0.999
eta : 512
aug : none
eps : 8/255
steps : 10
step_size : 2/255/1
epochs : 50
batch_size : 128
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : False   # dead flag: only a fallback when student_norm is absent (utils.py:459); student_norm is explicit below
student_norm : False
teacher_norm : False
teacher_cos_head : False
featdir_normfeat_target : False
featdir_rawteacher : True
featdir_rawstudent : True
featdir_head_ce : False
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean_5ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_5ep/clean_last.pkl
data_root : ./data
