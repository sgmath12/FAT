# PAPER-BASE 2x2, cell snorm/tnorm (2026-08-09, theory_experiment_necessary.md Phase 1).
# Pure directional loss ||s_hat - t_hat||^2 = 2-2cos. The reference cell.
# Paper-base = champion recipe STRIPPED of every auxiliary device: no WA, no AWP, no angeps,
# no freeze_lr, train eps = eval eps = 8/255 exactly. Head input normalized (student_norm True).
# Registered predictions: see theory_experiment_necessary.md (P-A/P-B/P-C) -- do not edit there.
method : feat_direction
featdir_rawteacher : False
featdir_rawstudent : False
featdir_span : random
gain_head : False
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 16
kappa : 0.999
eta : 512
aug : none
eps : 8/255
steps : 10
step_size : 2/255/1
epochs : 100
batch_size : 128
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
