# cos 2x2 cell (2): NORM student + COSINE teacher target (directional SUPERVISION only).
#   method temperature_costeacher: target = s_t * cos(Phi_t_hat, w_t_hat), s_t = E||Phi_t||*E||w_t||/tau
#   (frozen at first batch) -> tau=16 sharpness-matches the raw z_t/tau target = fair start; sweep --tau.
#   Fair bar: 50k baseline tau16 seed0 H 41.77 (63.04/31.23).
method : temperature_costeacher
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
tau : 16
kappa : 0.999
aug : none
eps : 8/255
steps : 3
step_size : 4/255/1
epochs : 50
batch_size : 128
interval : 5
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cos_head : False
val : False
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
aa : False
