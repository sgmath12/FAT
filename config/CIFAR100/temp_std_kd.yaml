# STANDARD Hinton KD temperature (control for asymmetric temp). method train_temperature_std.
#   teacher/T AND student/T before softmax, loss x T^2, inner PGD also uses student/T. T = tau.
#   student L2-norm, teacher raw. steps=3. Sweep T via --tau. Compare vs asymmetric temp (best 41.62 @tau16)
#   and swap. Results -> results/CIFAR100/temp_std_kd/output.log (cells by tau).
method : temperature_std
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
tau : 16
kappa : 0.999
aug : none
eps : 8/255
steps : 3
step_size : 4/255/1
epochs : 50
batch_size : 128
interval : 5
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
