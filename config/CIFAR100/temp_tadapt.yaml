# TEACHER-SIDE LEARNABLE TEMPERATURE T(x): teacher-analog of padapt (p(x) was student-side norm strength).
#   method train_temperature_tadapt: target = rectify_swap(teacher_logits, y) / T(x).
#   T(x) = tau * exp(r_centered), r_centered = clamp(T_head(Phi_teacher.detach()), -t_clamp, t_clamp) - batch_mean(...)
#   T_head zero-init -> T(x)=tau exactly at step 0 (same start as the fixed swap baseline).
#   Batch log-centering pins geomean(T(x))==tau every step -- blocks the "T->inf trivializes KD loss" collapse;
#   clamp (default ln2 -> T in [tau/2, 2*tau]) blocks the kappa(x) near-zero-temp divergence mode.
#   Direct A/B against temp_studentNorm_teacherRaw_swap.yaml (same tau=16, isolated: lamda=0, weight_avg=False).
#   Per-epoch T(x) mean/std/p5/p50/p95 logged -> results/CIFAR100/temp_tadapt/output.log.
method : temperature_tadapt
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
tau : 16
kappa : 0.999
aug : none
eps : 8/255
steps : 3
step_size : 4/255/1
epochs : 50
batch_size : 128
interval : 5
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
t_adapt : True
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
