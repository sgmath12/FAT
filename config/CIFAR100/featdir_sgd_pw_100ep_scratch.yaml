# SGD + PIECEWISE, 100ep, FROM SCRATCH (2026-07-29 night). Same as featdir_sgd_pw_100ep but
# finetune:False -- ADR's actual regime. Rationale: the SGD divergence looked like a large
# LR DESTROYING the clean warm start (clean 71->50->40->3 over the first epochs); training
# from scratch has no init to destroy. Isolates warm-start-vs-scratch from the schedule fix.
method : feat_direction
featdir_span : random
gain_head : False
dataset : CIFAR100
arch: ResNet18
optim : SGD
lr : 0.1
alpha : 1.0
lamda : 4.0
beta : 1.0
tau : 16
kappa : 0.999
eta : 350
aug : none
eps : 8/255
steps : 10
step_size : 2/255/1
epochs : 100
batch_size : 128
interval : 5
aa : False
log : True
load : True
finetune : False
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : False
weight_avg : True
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data

weight_decay : 0.0005
lr_schedule : piecewise
lr_factor : 10
stage1 : 50
stage2 : 75
