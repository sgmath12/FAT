# Bilevel TauNet, meta loss = CE(adv) + feature L2 consistency (user's idea, 2026-07-05): combines the
#   "adv" and "featdiff" meta objectives -- rewards tau(x) choices where the proxy-updated backbone BOTH
#   classifies the adversarial meta example correctly AND keeps its feature representation close to the
#   clean version. Same base: gradnorm input [norm,entropy,gradnorm], v2 arch, window 0-10, 3-step.
#   Also uses the NORMALIZED proxy step (fixed step norm) to remove the "sharper tau -> bigger inner_loss
#   gradient -> bigger one-step proxy update -> looks better to L_after" confound identified 2026-07-05.
method : temperature_taunet_bilevel
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
tau : 16
kappa : 0.999
aug : none
eps : 8/255
steps : 3
step_size : 4/255/1
epochs : 50
batch_size : 128
interval : 5
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
tau_adapt : True
tau_hidden : 64
tau_depth : 2
tau_bn : True
val : True
bilevel_start : 0
bilevel_end : 10
tau_meta_lr : 100
bilevel_meta_loss : advfeat
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
aa : False
