# T.3 ANCHOR-RANK SWEEP (2026-08-08), k=64.  Champion recipe verbatim except eta (=k).
# Theorem 3: label/low-rank supervision leaves m(d-r) backbone directions unidentified;
# the head is re-solved so the classifier reads all d.  PREDICTION: AA flat in k, clean
# and cos(Phi_s(x),Phi_t(x)) MONOTONICALLY INCREASING in k.  k=512 point = the existing
# champion (62.17 / 34.77 / AA 28.59).
# featdir_attack_full_rank keeps the ATTACK at full rank so k varies the SUPERVISION
# rank alone -- otherwise a small k also weakens the adversary, which pushes clean the
# opposite way and makes the sweep uninformative.
# aa: False -- AA only on the winner (sweep convention).
method : feat_direction
featdir_span : random
gain_head : False
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 16
kappa : 0.999
eta : 64
aug : none
eps : 8/255
train_eps : 0.03450980392156863
steps : 10
step_size : 2/255/1
epochs : 100
freeze_lr_epoch : 0.65
wa_start : 0.2
batch_size : 128
interval : 5
aa : False
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : True
awp_style : proxy
awp_gamma : 0.005
awp_warmup : 10
checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
featdir_angeps_p : 1.0
featdir_attack_full_rank : True
