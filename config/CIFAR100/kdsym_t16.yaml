# CONVENTIONAL KD, THE SAME TEMPERATURE ON BOTH SIDES, tau = 16 (2026-09-08).
#
# The tausens_kd_* cells soften the TEACHER alone, so at tau != 1 the student's distribution differs
# from the target at initialization even though the student IS the teacher.  Conventional knowledge
# distillation applies tau to both sides with the usual tau^2 scaling, and under our warm start the
# clean discrepancy is then exactly zero at every tau.  Comparing the two rules out the reading that
# the feature target wins because asymmetric temperature handed the logit target an initial
# mismatch.  The attack is generated from the same objective (utils.inner_loss_only_return now takes
# the student-side tau).
#
# Changed from tausens_kd_t16 in one field: kd_symmetric.
#

method : temperature
kd_symmetric : True
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 16
kappa : 0.999
aug : none
eps : 8/255
steps : 10
step_size : 2/255/1
epochs : 50
batch_size : 128
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : False
student_norm : False
teacher_norm : False
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
