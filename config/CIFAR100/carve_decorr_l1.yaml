# decorrelated carve, L1 fragility (method train_carve_decorr_l1; NOT the transform dispatcher).
#   Carve only vulnerable & class-IRRELEVANT channels; protect class-relevant ones.
#     fragility  = |Phi_t(x)-Phi_t(x_adv)| (L1, PGD-2);  class_need = |W[y]*Phi_t(x)|
#     gate = exp(-beta*need_rel);  w = exp(-tau*fragility*gate);  target = teacher.linear(Phi_t*w)
#   tau = fragility carve strength; beta = class-protection strength. beta=0 == plain carve_only_l1.
#   teacher raw (teacher_norm=False), student L2-norm (student_norm=True). NO /13, NO teacher norm.
# Fast regime (steps=3). Results -> results/CIFAR100/carve_decorr_l1/output.log. Sweep via --tau/--beta.
method : carve_decorr_l1
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
beta : 1.0
gamma : 2
lamda : 0.0
tau : 0.2
kappa : 0.999
aug : none
eps : 8/255
steps : 3
step_size : 4/255/1
epochs : 50
batch_size : 128
interval : 5
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
