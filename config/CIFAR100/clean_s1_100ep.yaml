# Natural teacher, seed 1, trained for 100 epochs with its own one-cycle schedule (2026-09-20).
# This is how the seed-0 ladder was built: one converged run per epoch count.  Snapshots taken
# mid-run are NOT the same thing under a one-cycle schedule -- at the schedule's high-lr midpoint the
# model sits at 59-63% clean accuracy on the way to 78%, as the save_epochs attempt showed.
method : clean
dataset : CIFAR100
arch: ResNet18
optim : SGD

lr : 0.1
alpha : 0.0
beta : 0.0
gamma : 0.0
eta : 0.0
eps : 8/255
steps : 10
step_size : 2/255/1
epochs : 100


batch_size : 128
interval : 5
neptune : True
load : False
finetune : False
evaluate : False
reformation : False
save : False
exp_name: KD
val : False
aug : none
log : True
cyclic : True
data_root : ./data
seed : 1
