# NO-FEATURE-TERM ABLATION, grid regime (2026-08-02, user q). Same 50ep / 10-step / WA off /
# AWP off / eps 8 / lamda 0 / clean_200ep-teacher setting as every fg_* cell, with the feature term
# REMOVED entirely:
#     loss = KL( softmax(z_t(x)/16) || softmax(f_s(x_adv)) )
# Direct comparison: fg_plain_th_sh_kl = 62.61 / 29.16 / 26.63 (same regime, feature term present).
# The reviewer's first question -- is the smoothed teacher logit the whole method?
# Caveat when reading: this regime transferred to the champion stack on the HEAD axis (kl>ce held,
# tau16>tau1 held) but NOT on the backbone axis (raw>hat reversed). Treat as a fast first read.
# The inner attack is KL-to-target here vs feature-direction in the fg_* cells; that is the matched
# adversary for each loss, not a confound to remove.
method : temperature
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 16
kappa : 0.999
aug : none
eps : 8/255
steps : 10
step_size : 2/255/1
epochs : 50
batch_size : 128
interval : 5
aa : False
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
