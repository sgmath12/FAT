# Consistency-AT: OWN RECIPE, NATURAL-TEACHER INITIALIZATION (2026-09-11).
#
# Layer two of tab:main -- the same recipe the authors use, with the natural teacher as the student's
# starting point.  None of the seven methods measured so far gains from this, which is the point: the
# warm start our own cells have is not what separates them.  Changed from consistency_100ep in one field.
#

method : consistency
weight_decay : 0.0002
dataset : CIFAR100
arch : ResNet18
optim : SGD
lr : 0.1
lr_schedule : piecewise
stage1 : 70
stage2 : 90
lr_factor : 10
cyclic : False
epochs : 100
batch_size : 128
eps : 8/255
steps : 10
step_size : 2/255/1
weight_avg : False
kappa : 0.999
alpha : 1.0
beta : 6.0
lamda : 1.0
tau : 16
eta : 512
aug : none
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : False
student_norm : False
teacher_norm : False
checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
two_views : True
tau_consistency : 0.5
