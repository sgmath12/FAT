# decorr span cell (2026-07-19, user q "취약도 크고 클래스정보 작은 걸로 걸러서 350차원 이런방식은?"):
# ports the one subspace-selection idea that ever actually WON (train_carve_decorr_l1, old KL
# pipeline, 2026-07-02: beat baseline on both pgd50/cw) into the current k350 framework as a HARD
# channel selection. Per-dim fragility=|Phi_t(x)-Phi_t(x_adv)| (PGD-2 teacher carve) and
# class_need=|W_t[pred]*Phi_t(x)| estimated once (10 probe batches); the k=350 LOWEST-score
# (fragility*exp(-beta*need_rel)) dims -- i.e. safest/most class-relevant -- go into Q (graded);
# the other 162 (vulnerable & class-irrelevant) are left free, same slot the champion fills with
# a random pick. featdir_span: decorr, featdir_decorr_beta controls class-protection strength.
# Otherwise identical to champion (k350+WA+lamda4). Bar: clean62.75/pgd20 33.96/cw28.41.
method : feat_direction
featdir_span : decorr
featdir_decorr_beta : 1.0
gain_head : False
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 4.0
beta : 1.0
tau : 16
kappa : 0.999
aug : none
eps : 8/255
steps : 10
step_size : 2/255/1
epochs : 50
batch_size : 128
interval : 5
aa : False
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : True
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
