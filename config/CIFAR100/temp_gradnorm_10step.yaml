# gradnorm gamma=0.3 (teacher-only input-gradient-norm temperature, best 3-step teacher-only signal,
#   H=41.97), HEAVY AT (steps=10, step_size 2/255) re-verification.
method : temperature_gradnorm
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
tau : 16
gamma : 0.3
vuln_swap : True
kappa : 0.999
aug : none
eps : 8/255
steps : 10
step_size : 2/255/1
epochs : 50
batch_size : 128
interval : 5
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
