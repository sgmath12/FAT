# PAPER-BASE 2x2, cell sraw/traw (2026-08-09, theory_experiment_necessary.md Phase 1).
# Raw L2 loss ||phi_s - phi_t||^2: direction + magnitude command ||phi_s|| -> ||phi_t||cos.
# The headline contrast against b2x2_snorm_tnorm. Head input still normalized.
# Registered predictions: P-A = clean down at AA tie w/ norm bound near teacher scale;
# P-B = tie with reference (stack interaction); P-C = raw wins AA. See plan file.
method : feat_direction
featdir_rawteacher : True
featdir_rawstudent : True
featdir_span : random
gain_head : False
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 16
kappa : 0.999
eta : 512
aug : none
eps : 8/255
steps : 10
step_size : 2/255/1
epochs : 100
batch_size : 128
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
