# 100ep + AWP (2026-07-29): the 100ep control PLUS proxy-AWP (Wu et al.) gamma 0.005, warmup 10.
# Purpose: the MATCHED no-AWP control for the 100ep+AWP cell. The existing 100ep run
# (featdir_teacher300ep_eps8_lamda4_100ep, 59.34/31.79/27.75) is NOT matched -- different
# teacher (clean_300ep) and no warm start -- so it cannot serve as the baseline.
# Robust overfitting is the thing being measured here: champion is 33.96 pgd20 at 50ep.
method : feat_direction
featdir_span : random
gain_head : False
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 4.0
beta : 1.0
tau : 16
kappa : 0.999
eta : 350
aug : none
eps : 8/255
steps : 10
step_size : 2/255/1
epochs : 100
batch_size : 128
interval : 5
aa : False
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : True
awp_style : proxy
awp_gamma : 0.005
awp_warmup : 10
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
