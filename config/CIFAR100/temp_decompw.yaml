# IDEA A (input-dependent, gradient-level, DECOMPOSITION signal): per-sample KD weight from
#   the TYPE of teacher vulnerability, not its size. Teacher dz under student's adversary split into
#   magnitude channel (z_mag = linear(s*Phi), s = norm ratio) vs rotation residual; r = rot share.
#   w = exp(-gamma * r/mean(r)) mean-1: downweight rotation-dominant (direction corrupted; norm
#   channel is what normalization already fixes). gamma=0 == baseline exactly. Sweep via --gamma.
#   Base = tau=16, isolated (lamda=0, weight_avg=False). Per-epoch rot_share stats logged.
#   Results -> results/CIFAR100/temp_decompw/output.log (parse by gamma).
method : temperature_decompw
dataset : CIFAR100
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
gamma : 0.0
tau : 16
kappa : 0.999
aug : none
eps : 8/255
steps : 3
step_size : 4/255/1
epochs : 50
batch_size : 128
interval : 5
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : False
checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR100/checkpoint/clean/clean_last.pkl
data_root : ./data
