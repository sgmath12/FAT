method : DPFAT_rank
dataset : CIFAR10
arch: ResNet18

optim : AdamW
lr : 0.021
alpha : 0.5
tau : 1.0
lamda : 5.0
kappa : 0.999
aug : none

# ===== rank-margin temperature signal =====
# reformation=True: logit scale ~6x smaller (~0.43) vs no_normalize (~2.66)
# margin (top1-top2) with reform: mean ~1.3, p5 ~0.25, p95 ~2.0
# -> tau_reform ≈ 6x tau_no_normalize to match same T operating point
# no_normalize best: tau=0.2, T_med=2.1  =>  reform target: tau=1.0-1.5
signal : margin
rank : False

# attack Setting
eps : 8/255
steps : 3
step_size : 4/255/1
epochs : 50

batch_size : 128
interval : 5
log : True
load : True
finetune : True
evaluate : True
reformation : True
cyclic : True
weight_avg : True
checkpoint : CIFAR10/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR10/checkpoint/clean/clean_last.pkl
data_root : ./data
aa : False
