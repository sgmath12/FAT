# 2026-07-23: CIFAR10 port of the CIFAR100 champion (featdir k350+WA+lamda4, tau16/beta1/eps8).
# Teacher = the 200ep mixup clean net (clean 95.76, higher-entropy natural teacher).
# k (subspace dim) comes from --eta; lamda from --lamda 4.0 (both CLI, like the CIFAR100 champion).
# Used to sweep eta and check whether the CIFAR100 k-curve symptom (left cliff at small k / robust
# decay toward k=512 / interior optimum = capacity reservation) reproduces on CIFAR10.
method : feat_direction
featdir_span : random
gain_head : False
dataset : CIFAR10
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 16
kappa : 0.999
aug : none
eps : 8/255
steps : 10
step_size : 2/255/1
epochs : 50
batch_size : 128
interval : 5
aa : False
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : True
# 2026-07-26 fix: _last.pkl was overwritten by the WideResNet sweep (same clean_mixup_200ep
# config name -> same checkpoint dir), so this config could no longer load its own teacher.
# clean_mixup_95.7600_best.pkl is the surviving ResNet-18 teacher (clean 95.76) the eta sweep used.
checkpoint : CIFAR10/checkpoint/clean_mixup_200ep/clean_mixup_95.7600_best.pkl
finetune_checkpoint : CIFAR10/checkpoint/clean_mixup_200ep/clean_mixup_95.7600_best.pkl
data_root : ./data
