# CIFAR10 + ANGULAR-BUDGET EPS (2026-08-04). CIFAR10 champion recipe + featdir_angeps_p 1.0.
# CIFAR100 result that motivates it: champion 60.74/30.53/AA 28.69/NRR 38.97
#                              -> +angeps 62.17/30.92/AA 28.59/NRR 39.17 (ADR-full beaten on all four).
# CIFAR10 comparator without angeps: 82.52 / 57.20 / CW 53.74 / AA 51.89 / NRR 63.72.
# Bars from comparison_resnet18_cifar10.md: ADR-full (AT+WA+AWP+ADR) 83.26 / AA 51.18 ; ST-AT AA 50.50.
# Nothing retuned for CIFAR10 -- same transfer-as-is discipline as the base recipe. Note clean is
# already ~82 here, so the clean-side headroom that CIFAR100 had (60%) mostly does not exist; a
# smaller gain than CIFAR100 is the expected outcome, not a failure.
method : feat_direction
featdir_span : random
gain_head : False
dataset : CIFAR10
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 16
kappa : 0.999
eta : 512
aug : none
eps : 8/255
train_eps : 0.03450980392156863
steps : 10
step_size : 2/255/1
epochs : 100
freeze_lr_epoch : 0.65
wa_start : 0.2
batch_size : 128
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : True
awp_style : proxy
awp_gamma : 0.005
awp_warmup : 10
checkpoint : CIFAR10/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR10/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
featdir_angeps_p : 1.0
