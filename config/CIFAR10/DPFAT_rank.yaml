method : DPFAT_rank
dataset : CIFAR10
arch: ResNet18

optim : AdamW
lr : 0.021
alpha : 0.5
tau : 2.0          # rank in (0,1] -> T = tau*rank + alpha in [alpha, alpha+tau]; scale-invariant, needs sweep
lamda : 5.0
kappa : 0.999
aug : none

# ===== rank-margin temperature signal (B) =====
signal : margin    # 'margin' (top1-top2 teacher logit) | 'norm' (||feat||, original)
rank : True        # rank-normalize signal to (0,1] -> forces full per-sample dispersion

# attack Setting
eps : 8/255
steps : 3
step_size : 4/255/1
epochs : 50

batch_size : 128
interval : 5
log : True
load : True
finetune : True
evaluate : True
reformation : False
cyclic : True
weight_avg : True
checkpoint : CIFAR10/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR10/checkpoint/clean/clean_last.pkl
data_root : ./data
aa : False
