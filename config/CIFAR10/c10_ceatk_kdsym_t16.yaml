# CONVENTIONAL KD, tau = 16, CIFAR-10, shared true-label CE attack (2026-09-08).
#
# The CE-attack half of the CIFAR-10 target comparison, so the 4x2 table exists on both datasets.
# On CIFAR-100 the ordering was identical under both attacks and the anchor lost the least when the
# attack was taken away from it (-0.61 AA against the logit MSE's -0.91).
#

method : temperature
attack_ce : True
kd_symmetric : True
weight_avg : False
dataset : CIFAR10
arch : ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 16
kappa : 0.999
aug : none
eps : 8/255
steps : 10
step_size : 2/255/1
epochs : 50
batch_size : 128
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : False
student_norm : False
teacher_norm : False
cyclic : True
checkpoint : CIFAR10/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR10/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
