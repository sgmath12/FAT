# ISOLATED 2x2 cell B: NO normalization + ADAPTIVE temperature
# reformation=False, tau>0 (T=tau*||Phi_raw||+alpha, per-sample), isolated: lamda=0, weight_avg=False
# Sweep tau/alpha via CLI. Output -> results/CIFAR10/iso2_nonorm_adapt/
method : DPFAT_adaptive
dataset : CIFAR10
arch: ResNet18

optim : AdamW
lr : 0.021
alpha : 0.5
lamda : 0.0          # ISOLATED: no consistency loss
tau : 1.0            # ADAPTIVE (best from full regime)
kappa : 0.999
aug : none
# attack Setting
eps : 8/255
steps : 3
step_size : 4/255/1
epochs : 50

batch_size : 128
interval : 5
log : True
load : True
finetune : True
evaluate : True
reformation : False
cyclic : True
weight_avg : False   # ISOLATED: no SWA
checkpoint : CIFAR10/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR10/checkpoint/clean/clean_last.pkl
data_root : ./data
