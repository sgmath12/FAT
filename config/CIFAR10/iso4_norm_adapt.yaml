# ISOLATED 2x2 cell D: normalization ON + ADAPTIVE temperature  (= the paper's DPD, isolated)
# reformation=True, tau>0 (kappa=tau*||Phi_raw||+alpha per-sample on directional logits)
# isolated: lamda=0, weight_avg=False
# NOTE: with reform=True the per-sample signal is the RAW feat norm (~6.4, disp 1.45x),
# so a TINY tau (e.g. 0.001) -> kappa~const (this is why original DPFAT was inert).
# To make adaptivity actually fire while holding median temp ~0.5, use the centered
# rule: alpha = 0.5 - tau*6.4. Sweep tau via CLI (alpha set per-tau in the script).
# Output -> results/CIFAR10/iso4_norm_adapt/
method : DPFAT_adaptive
dataset : CIFAR10
arch: ResNet18

optim : AdamW
lr : 0.021
alpha : 0.18
lamda : 0.0          # ISOLATED: no consistency loss
tau : 0.05           # ADAPTIVE, centered (median kappa ~0.5, dispersion fires)
kappa : 0.999
aug : none
# attack Setting
eps : 8/255
steps : 3
step_size : 4/255/1
epochs : 50

batch_size : 128
interval : 5
log : True
load : True
finetune : True
evaluate : True
reformation : True
cyclic : True
weight_avg : False   # ISOLATED: no SWA
checkpoint : CIFAR10/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR10/checkpoint/clean/clean_last.pkl
data_root : ./data
