# 2026-07-25: WA-ON twin of featdir_wrn_mixupT.yaml (WideResNet-34-10 CIFAR10 featdir).
# Identical recipe -- teacher = 200ep WideResNet mixup clean net, student = WideResNet_z,
# tau16/beta1/eps8, eta/lamda/epochs from CLI -- but weight_avg: True (weight averaging ON).
# Paired with the WA-off config in the 2x2x2 sweep (lamda{0,4} x WA{on,off} x epochs{50,100}).
method : feat_direction
featdir_span : random
gain_head : False
dataset : CIFAR10
arch: WideResNet
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 16
kappa : 0.999
aug : none
eps : 8/255
steps : 10
step_size : 2/255/1
epochs : 50
batch_size : 128
interval : 5
aa : False
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : True
checkpoint : CIFAR10/checkpoint/clean_mixup_200ep/clean_mixup_last.pkl
finetune_checkpoint : CIFAR10/checkpoint/clean_mixup_200ep/clean_mixup_last.pkl
data_root : ./data
