# CIFAR10 port of the champion (2026-08-03). Recipe is featdir_champ200_100ep verbatim -- teacher
# clean_200ep (same SGD 0.1 one-cycle 200ep plain recipe, retrained for CIFAR10), AdamW lr .021
# one-cycle 100ep, freeze_lr .65, WA kappa .999 wa_start .2, proxy AWP .005 warmup 10,
# train_eps 8.8/255, k512, lamda 0, tau 16, aa True.
# Nothing is retuned for CIFAR10 on purpose: the point is whether the recipe transfers, and a tuned
# CIFAR10 number would not answer that. tau 16 in particular was chosen on 100 classes and the head
# here has 10 -- if this run underperforms, tau is the first thing to check, not the method.
# CIFAR100 reference: 60.74 clean / 34.94 PGD-20 / 30.53 CW / 28.69 AA / NRR 38.97.
method : feat_direction
featdir_span : random
gain_head : False
dataset : CIFAR10
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 16
kappa : 0.999
eta : 512
aug : none
eps : 8/255
train_eps : 0.03450980392156863
steps : 10
step_size : 2/255/1
epochs : 100
freeze_lr_epoch : 0.65
wa_start : 0.2
batch_size : 128
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : True
teacher_norm : False
cyclic : True
weight_avg : True
awp_style : proxy
awp_gamma : 0.005
awp_warmup : 10
checkpoint : CIFAR10/checkpoint/clean_200ep/clean_last.pkl
finetune_checkpoint : CIFAR10/checkpoint/clean_200ep/clean_last.pkl
data_root : ./data
