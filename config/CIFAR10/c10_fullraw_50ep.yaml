# CIFAR-10 REPLICATION of the backbone axis (2026-08-02, user q). Same 50ep / 10-step / WA off /
# AWP off / eps 8 / lamda 0 / k512 / AdamW 0.021 regime as the CIFAR-100 fg_* grid, on the existing
# CIFAR-10 clean teacher (94.20%). Two cells so the ORDERING can be read, not just one number:
#   c10_tr_sr_kl : raw feature matching   || phi_s(x_adv) - phi_t(x) ||^2
#   c10_th_sh_kl : direction matching     || phi_s_hat  - phi_t_hat ||^2
# CIFAR-100 result to replicate: raw beat hat by +1.35 PGD / +0.61 CW at tied clean in this regime,
# then TIED on robustness (and lost 0.95 clean) once the full 100ep+WA+AWP stack was added. So the
# question here is whether the stripped-regime ordering is a property of the loss or of CIFAR-100.
# Head is KD to z_t/tau16 in both, reading the normalized student feature -- held fixed.
method : feat_direction
featdir_span : random
dataset : CIFAR10
arch: ResNet18
optim : AdamW
lr : 0.021
alpha : 1.0
lamda : 0.0
beta : 1.0
tau : 16
kappa : 0.999
eta : 512
aug : none
eps : 8/255
steps : 10
step_size : 2/255/1
epochs : 50
batch_size : 128
interval : 5
aa : True
log : True
load : True
finetune : True
evaluate : True
reformation : True
student_norm : False
teacher_norm : False
teacher_cos_head : False
featdir_rawteacher : True
featdir_rawstudent : True
featdir_head_ce : False
cyclic : True
weight_avg : False
checkpoint : CIFAR10/checkpoint/clean/clean_last.pkl
finetune_checkpoint : CIFAR10/checkpoint/clean/clean_last.pkl
data_root : ./data
aa_batch_size : 256
